        // Verificar si Firebase está configurado
        const isFirebaseConfigured = firebaseConfig.apiKey !== "TU_API_KEY";

        // Inicializar Firebase solo si está configurado
        let database = null;
        let firebaseInitialized = false;

        if (isFirebaseConfigured) {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseInitialized = true;
                console.log('✅ Firebase inicializado correctamente');
            } catch (error) {
                console.error('❌ Error inicializando Firebase:', error);
            }
        } else {
            console.warn('⚠️ Firebase no configurado. Usando modo local (localStorage)');
        }

        // ==================== STORAGE WRAPPER ====================
        // Abstracción que usa Firebase si está disponible, sino localStorage
        window.storage = {
            async get(key) {
                if (firebaseInitialized) {
                    try {
                        const snapshot = await database.ref(key).once('value');
                        const value = snapshot.val();
                        return value ? { key, value: JSON.stringify(value) } : null;
                    } catch (error) {
                        console.error('Error obteniendo datos de Firebase:', error);
                        return null;
                    }
                } else {
                    // Fallback a localStorage
                    try {
                        const value = localStorage.getItem(key);
                        return value ? { key, value } : null;
                    } catch (error) {
                        return null;
                    }
                }
            },

            async set(key, value) {
                if (firebaseInitialized) {
                    try {
                        const data = typeof value === 'string' ? JSON.parse(value) : value;
                        await database.ref(key).set(data);
                        return { key, value: JSON.stringify(data) };
                    } catch (error) {
                        console.error('Error guardando en Firebase:', error);
                        return null;
                    }
                } else {
                    // Fallback a localStorage
                    try {
                        localStorage.setItem(key, value);
                        return { key, value };
                    } catch (error) {
                        return null;
                    }
                }
            },

            async delete(key) {
                if (firebaseInitialized) {
                    try {
                        await database.ref(key).remove();
                        return { key, deleted: true };
                    } catch (error) {
                        console.error('Error eliminando de Firebase:', error);
                        return null;
                    }
                } else {
                    // Fallback a localStorage
                    try {
                        localStorage.removeItem(key);
                        return { key, deleted: true };
                    } catch (error) {
                        return null;
                    }
                }
            },

            // Método para escuchar cambios en tiempo real
            onValue(key, callback) {
                if (firebaseInitialized) {
                    return database.ref(key).on('value', (snapshot) => {
                        callback(snapshot.val());
                    });
                } else {
                    // En localStorage no hay tiempo real
                    return null;
                }
            },

            // Método para dejar de escuchar
            off(key) {
                if (firebaseInitialized) {
                    database.ref(key).off();
                }
            }
        };

            const email = e.target.email.value;
            const password = e.target.password.value;
            const name = e.target.name.value;
            const comment = e.target.comment.value;

            if (users.find(u => u.email === email) || pendingUsers.find(u => u.email === email)) {
              alert('Este correo ya está registrado');
              return;
            }

            const newUser = { 
              id: Date.now(), 
              name, 
              email, 
              password, 
              comment,
              role: 'user', 
              status: 'pending',
              requestDate: new Date().toLocaleString('es-MX')
            };

            const updatedPending = [...pendingUsers, newUser];
            setPendingUsers(updatedPending);
            await saveToStorage('pending-users', updatedPending);

            await sendEmail('admin@empresa.com', '🔔 Nueva solicitud de cuenta', `${name} (${email}) solicitó acceso`);
            await addToHistory('Solicitud de cuenta', `${name} (${email}) solicitó una cuenta`, { name: 'Sistema' });
            setView('pending');
          };

          const approveUser = async (userId) => {
            const userToApprove = pendingUsers.find(u => u.id === userId);
            if (userToApprove) {
              const approvedUser = { 
                ...userToApprove, 
                status: 'approved',
                role: userToApprove.role || 'user'
              };
              
              const updatedUsers = [...users, approvedUser];
              const updatedPending = pendingUsers.filter(u => u.id !== userId);
              
              setUsers(updatedUsers);
              setPendingUsers(updatedPending);
              
              await saveToStorage('approved-users', updatedUsers);
              await saveToStorage('pending-users', updatedPending);

              await sendEmail(userToApprove.email, '✅ Cuenta Aprobada', 'Tu cuenta ha sido aprobada');
              await addToHistory('Aprobación de usuario', `Admin aprobó la cuenta de ${userToApprove.name} (${userToApprove.email})`, currentUser);
              
              alert(`✅ Usuario ${userToApprove.name} aprobado correctamente`);
            }
          };

          const rejectUser = async (userId) => {
            const userToReject = pendingUsers.find(u => u.id === userId);
            if (userToReject) {
              const updatedPending = pendingUsers.filter(u => u.id !== userId);
              setPendingUsers(updatedPending);
              await saveToStorage('pending-users', updatedPending);

              await sendEmail(userToReject.email, '❌ Solicitud Rechazada', 'Tu solicitud fue rechazada');
              await addToHistory('Rechazo de usuario', `Admin rechazó la cuenta de ${userToReject.name}`, currentUser);
            }
          };

          const toggleUserRole = async (userId) => {
            const updatedUsers = users.map(user => {
              if (user.id === userId && user.email !== 'admin@empresa.com') {
                const newRole = user.role === 'admin' ? 'user' : 'admin';
                addToHistory(
                  'Cambio de rol',
                  `${currentUser.name} cambió el rol de ${user.name} a ${newRole === 'admin' ? 'Administrador' : 'Usuario'}`,
                  currentUser
                );
                return { ...user, role: newRole };
              }
              return user;
            });
            
            setUsers(updatedUsers);
            await saveToStorage('approved-users', updatedUsers);
            
            const updatedCurrentUser = updatedUsers.find(u => u.id === currentUser.id);
            if (updatedCurrentUser) {
              setCurrentUser(updatedCurrentUser);
              localStorage.setItem('current-user-session', JSON.stringify(updatedCurrentUser));
            }
          };

          const deleteUser = async (userId) => {
            const userToDelete = users.find(u => u.id === userId);
            if (userToDelete && userToDelete.email === 'admin@empresa.com') {
              alert('⛔ No puedes eliminar al administrador principal');
              return;
            }
            
            if (window.confirm(`¿Estás seguro de eliminar al usuario ${userToDelete?.name}?`)) {
              const updatedUsers = users.filter(u => u.id !== userId);
              setUsers(updatedUsers);
              await saveToStorage('approved-users', updatedUsers);
              await addToHistory('Usuario eliminado', `Admin eliminó al usuario ${userToDelete.name}`, currentUser);
            }
          };

          const handleSaveConfig = (config) => {
            alert('⚠️ Para aplicar la configuración de Firebase:\n\n1. Copia el código HTML\n2. Reemplaza la configuración en firebaseConfig\n3. Recarga la página');
            setShowConfig(false);
          };

          const ConnectionIndicator = () => (
            <div className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs ${
              connectionStatus === 'connected' 
                ? 'bg-green-900/30 text-green-400 border border-green-500' 
                : connectionStatus === 'local'
                ? 'bg-yellow-900/30 text-yellow-400 border border-yellow-500'
                : 'bg-red-900/30 text-red-400 border border-red-500'
            }`}>
              {connectionStatus === 'connected' ? <Cloud /> : <CloudOff />}
              {connectionStatus === 'connected' ? 'Sincronizado' : connectionStatus === 'local' ? 'Modo Local' : 'Sin conexión'}
            </div>
          );

          // Por brevedad, incluyo solo el login. El resto de funciones son idénticas 
          // a la versión anterior pero con saveToStorage() en lugar de saveToStorage()
          
          if (showConfig) {
            return <ConfigPanel onClose={() => setShowConfig(false)} onSave={handleSaveConfig} />;
          }

          if (view === 'login') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
                <div className="bg-slate-800/50 backdrop-blur-xl rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-700">
                  <div className="flex flex-col items-center mb-8">
                    <div className="bg-blue-600 p-4 rounded-full mb-4">
                      <Package className="w-10 h-10" />
                    </div>
                    <h1 className="text-3xl font-bold text-white mb-2">Sistema de Inventario</h1>
                    <p className="text-slate-400 mb-4">Inicia sesión para continuar</p>
                    <ConnectionIndicator />
                    {!firebaseInitialized && (
                      <button
                        onClick={() => setShowConfig(true)}
                        className="mt-4 flex items-center gap-2 text-sm text-blue-400 hover:text-blue-300">
                        <Settings /> Configurar Firebase
                      </button>
                    )}
                  </div>
                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Email</label>
                      <input type="email" name="email" required
                        className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="tu@email.com" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
                      <input type="password" name="password" required
                        className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="••••••••" />
                    </div>
                    <button type="submit"
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition">
                      Iniciar Sesión
                    </button>
                  </form>
                  <div className="mt-6 text-center">
                    <button onClick={() => setView('register')}
                      className="text-blue-400 hover:text-blue-300 text-sm">
                      ¿No tienes cuenta? Solicitar acceso
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          // Resto de la app (register, pending, dashboard) sigue igual...
          // Por espacio solo muestro la estructura básica
          
          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 p-4">
              <div className="max-w-7xl mx-auto">
                <div className="bg-slate-800/50 backdrop-blur-xl rounded-xl p-6 mb-6">
                  <div className="flex items-center justify-between">
                    <h1 className="text-2xl font-bold text-white">
                      Dashboard - {currentUser?.name}
                    </h1>
                    <div className="flex items-center gap-3">
                      <ConnectionIndicator />
                      <button onClick={handleLogout} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                        <LogOut />
                      </button>
                    </div>
                  </div>
                </div>
                <div className="text-white text-center py-20">
                  <h2 className="text-3xl font-bold mb-4">Sistema Funcionando ✅</h2>
                  <p className="text-slate-300">
                    {firebaseInitialized 
                      ? '🔥 Firebase configurado - Sincronización multi-dispositivo activa'
                      : '📱 Modo local - Configura Firebase para sincronización multi-dispositivo'
                    }
                  </p>
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InventoryApp />);
    </script>
</body>
</html>
