            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseInitialized = true;
                console.log('✅ Firebase inicializado');
            } catch (error) {

            }
        } else {
            console.warn('⚠️ Firebase no configurado - Modo local');
        }

        // ==================== STORAGE WRAPPER ====================
        window.storage = {
            async get(key) {
                if (firebaseInitialized) {
                    try {
                        const snapshot = await database.ref(key).once('value');
                        const value = snapshot.val();
                        return value ? { key, value: JSON.stringify(value) } : null;
                    } catch (error) {
                        console.error('Error Firebase get:', error);
                        return null;
                    }
                } else {
                    try {
                        const value = localStorage.getItem(key);
                        return value ? { key, value } : null;
                    } catch (error) {
                        return null;
                    }
                }
            },

            async set(key, value) {
                if (firebaseInitialized) {
                    try {
                        const data = typeof value === 'string' ? JSON.parse(value) : value;
                        await database.ref(key).set(data);
                        return { key, value: JSON.stringify(data) };
                    } catch (error) {
                        console.error('Error Firebase set:', error);
                        return null;
                    }
                } else {
                    try {
                        localStorage.setItem(key, value);
                        return { key, value };
                    } catch (error) {
                        return null;
                    }
                }
            },

            async delete(key) {
                if (firebaseInitialized) {
                    try {
                        await database.ref(key).remove();
                        return { key, deleted: true };
                    } catch (error) {
                        console.error('Error Firebase delete:', error);
                        return null;
                    }
                } else {
                    try {
                        localStorage.removeItem(key);
                        return { key, deleted: true };
                    } catch (error) {
                        return null;
                    }
                }
            },

            onValue(key, callback) {
                if (firebaseInitialized) {
                    return database.ref(key).on('value', (snapshot) => {
                        callback(snapshot.val());
                    });
                }
                return null;
            },

            off(key) {
                if (firebaseInitialized) {
                    database.ref(key).off();
                }
            }
        };

        async function sendEmail(to, subject, message) {
            console.log('📧 Email simulado:', to, subject);
            return true;
        }

        function InventoryApp() {
          const [currentUser, setCurrentUser] = useState(null);

          const [pendingMaterials, setPendingMaterials] = useState([]);
          const [changeHistory, setChangeHistory] = useState([]);

          // Listeners de Firebase en tiempo real
          useEffect(() => {
            if (!firebaseInitialized) return;

            window.storage.onValue('inventory-data', (data) => {
              if (data) setInventory(data);
            });

            window.storage.onValue('approved-users', (data) => {
              if (data) setUsers(data);
            });

            window.storage.onValue('pending-users', (data) => {
              if (data) setPendingUsers(data);
            });

            window.storage.onValue('pending-materials', (data) => {
              if (data) setPendingMaterials(data);
            });

            window.storage.onValue('change-history', (data) => {
              if (data) setChangeHistory(data);
            });

            if (database) {
              database.ref('.info/connected').on('value', (snapshot) => {
                setConnectionStatus(snapshot.val() ? 'connected' : 'disconnected');
              });
            }

            return () => {
              window.storage.off('inventory-data');
              window.storage.off('approved-users');
              window.storage.off('pending-users');
              window.storage.off('pending-materials');
              window.storage.off('change-history');
            };
          }, []);

          useEffect(() => {
            const loadData = async () => {
              try {
                // Sesión del usuario (localStorage - privado por dispositivo)
                const userSession = localStorage.getItem('current-user-session');
                if (userSession) {
                  const user = JSON.parse(userSession);
                  setCurrentUser(user);
                  setView('dashboard');
                }
                
                const invResult = await window.storage.get('inventory-data');
                if (invResult) setInventory(JSON.parse(invResult.value));
                
                const pendingResult = await window.storage.get('pending-users');
                if (pendingResult) setPendingUsers(JSON.parse(pendingResult.value));
                
                const usersResult = await window.storage.get('approved-users');
                if (usersResult) {
                  const loadedUsers = JSON.parse(usersResult.value);
                  // Asegurar que el admin principal siempre esté
                  const hasAdmin = loadedUsers.find(u => u.email === 'admin@empresa.com');
                  if (!hasAdmin) {
                    setUsers([...loadedUsers, { id: 1, email: 'admin@empresa.com', password: 'admin123', role: 'admin', status: 'approved', name: 'Administrador' }]);
                  } else {
                    setUsers(loadedUsers);
                  }
                } else {
                  // Si no hay datos guardados, establecer el admin por defecto
                  const defaultAdmin = [{ id: 1, email: 'admin@empresa.com', password: 'admin123', role: 'admin', status: 'approved', name: 'Administrador' }];
                  setUsers(defaultAdmin);
                  await window.storage.set('approved-users', JSON.stringify(defaultAdmin));
                }
                
                const pendingMatResult = await window.storage.get('pending-materials');
                if (pendingMatResult) setPendingMaterials(JSON.parse(pendingMatResult.value));
                
                const historyResult = await window.storage.get('change-history');
                if (historyResult) setChangeHistory(JSON.parse(historyResult.value));

                // Modo oscuro (localStorage - privado por dispositivo)
                const darkModeResult = localStorage.getItem('dark-mode');
                if (darkModeResult) {
                  const isDark = JSON.parse(darkModeResult);
                  setDarkMode(isDark);
                  document.body.className = isDark ? 'dark-mode' : 'light-mode';
                }
              } catch (error) {
                console.log('Iniciando desde cero');
              }
            };
            loadData();
          }, []);

          const saveToStorage = async (key, data) => {
            try {
              await window.storage.set(key, JSON.stringify(data));
            } catch (error) {
              console.error('Error guardando datos:', error);
            }
          };

            const newMode = !darkMode;
            setDarkMode(newMode);
            document.body.className = newMode ? 'dark-mode' : 'light-mode';
            localStorage.setItem('dark-mode', JSON.stringify(newMode));
          };

          const addToHistory = (action, details, user) => {
            const historyEntry = {
              id: Date.now(),
              action,
              details,
              user: user?.name || user?.email || 'Sistema',
              userEmail: user?.email || 'sistema',
              timestamp: new Date().toLocaleString('es-MX'),
              date: new Date().toISOString()
            };
            const updatedHistory = [historyEntry, ...changeHistory];
            setChangeHistory(updatedHistory);
            saveToStorage('change-history', updatedHistory);
          };

          const handleLogin = (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            
            // Buscar en la lista de usuarios aprobados
            const user = users.find(u => 
              u.email === email && 
              u.password === password && 
              u.status === 'approved'
            );
            
            if (user) {
              setCurrentUser(user);
              localStorage.setItem('current-user-session', JSON.stringify(user));
              addToHistory('Inicio de sesión', `Usuario ${user.name} inició sesión`, user);
              setView('dashboard');
            } else {
              alert('Credenciales incorrectas o cuenta no aprobada');
            }
          };

          const handleRegister = async (e) => {
            e.preventDefault();
            const email = e.target.email.value;
            const password = e.target.password.value;
            const name = e.target.name.value;
            const comment = e.target.comment.value;

            if (users.find(u => u.email === email) || pendingUsers.find(u => u.email === email)) {
              alert('Este correo ya está registrado');
              return;
            }

            const newUser = { 
              id: Date.now(), 
              name, 
              email, 
              password, 
              comment,
              role: 'user', 
              status: 'pending',
              requestDate: new Date().toLocaleString('es-MX')
            };

            const updatedPending = [...pendingUsers, newUser];
            setPendingUsers(updatedPending);
            saveToStorage('pending-users', updatedPending);

            await sendEmail('admin@empresa.com', '🔔 Nueva solicitud de cuenta', `${name} (${email}) solicitó acceso`);
            addToHistory('Solicitud de cuenta', `${name} (${email}) solicitó una cuenta`, { name: 'Sistema' });
            setView('pending');
          };

          const handleLogout = () => {
            addToHistory('Cierre de sesión', `Usuario ${currentUser.name} cerró sesión`, currentUser);
            setCurrentUser(null);
            localStorage.removeItem('current-user-session');
            setView('login');
          };

          const approveUser = async (userId) => {
            const userToApprove = pendingUsers.find(u => u.id === userId);
            if (userToApprove) {
              // IMPORTANTE: Asegurarse de que tenga status 'approved'
              const approvedUser = { 
                ...userToApprove, 
                status: 'approved',
                role: userToApprove.role || 'user' // Asegurar que tenga rol
              };
              
              const updatedUsers = [...users, approvedUser];
              const updatedPending = pendingUsers.filter(u => u.id !== userId);
              
              setUsers(updatedUsers);
              setPendingUsers(updatedPending);
              
              // Guardar ambas listas
              await saveToStorage('approved-users', updatedUsers);
              await saveToStorage('pending-users', updatedPending);

              await sendEmail(userToApprove.email, '✅ Cuenta Aprobada', 'Tu cuenta ha sido aprobada');
              addToHistory('Aprobación de usuario', `Admin aprobó la cuenta de ${userToApprove.name} (${userToApprove.email})`, currentUser);
              
              alert(`✅ Usuario ${userToApprove.name} aprobado correctamente`);
            }
          };

          const rejectUser = async (userId) => {
            const userToReject = pendingUsers.find(u => u.id === userId);
            if (userToReject) {
              const updatedPending = pendingUsers.filter(u => u.id !== userId);
              setPendingUsers(updatedPending);
              saveToStorage('pending-users', updatedPending);

              await sendEmail(userToReject.email, '❌ Solicitud Rechazada', 'Tu solicitud fue rechazada');
              addToHistory('Rechazo de usuario', `Admin rechazó la cuenta de ${userToReject.name}`, currentUser);

              setInventory(updatedInventory);
              saveToStorage('inventory-data', updatedInventory);

          const handleAdjustQuantity = (id, adjustment) => {

            const wb = XLSX.utils.book_new();

            XLSX.writeFile(wb, `inventario_${new Date().toISOString().split('T')[0]}.xlsx`);

              try {

                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet);

                let imported = 0;
                let errors = 0;

                const newItems = jsonData.map((row, index) => {

                    if (!row.Modelo || !row.Cantidad || !row.Ubicación) {
                      errors++;
                      return null;
                    }

                    imported++;
                    return {
                      id: Date.now() + index,
                      modelo: row.Modelo || '',
                      equipo: row.Equipo || '',
                      cantidad: parseInt(row.Cantidad) || 0,
                      stockMinimo: parseInt(row['Stock Mínimo']) || 10,
                      ubicacion: row.Ubicación || '',

                console.error('Error:', error);

                        <XCircle />
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                      <div className="bg-blue-600/20 border border-blue-500 rounded-lg p-4">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-blue-300 text-sm">Registros Totales</p>
                            <p className="text-3xl font-bold text-white">{stats.totalRecords}</p>
                            <p className="text-blue-200 text-xs mt-1">{stats.uniqueModels} modelos únicos</p>
                          </div>
                          <Package className="w-12 h-12 text-blue-400" />
                        </div>
                      </div>

                      <div className="bg-green-600/20 border border-green-500 rounded-lg p-4">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-green-300 text-sm">Cantidad Total</p>
                            <p className="text-3xl font-bold text-white">{stats.totalQuantity}</p>
                            <p className="text-green-200 text-xs mt-1">Suma de todas las unidades</p>
                          </div>
                          <TrendingUp className="w-12 h-12 text-green-400" />
                        </div>
                      </div>

                      <div className="bg-yellow-600/20 border border-yellow-500 rounded-lg p-4">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-yellow-300 text-sm">Stock Bajo</p>
                            <p className="text-3xl font-bold text-white">{stats.lowStock}</p>
                            <p className="text-yellow-200 text-xs mt-1">Ubicaciones afectadas</p>
                          </div>
                          <AlertTriangle className="w-12 h-12 text-yellow-400" />
                        </div>
                      </div>

                      <div className="bg-red-600/20 border border-red-500 rounded-lg p-4">
                        <div className="flex items-center justify-between">
                          <div>
                            <p className="text-red-300 text-sm">Crítico</p>
                            <p className="text-3xl font-bold text-white">{stats.critical}</p>
                            <p className="text-red-200 text-xs mt-1">Requiere atención inmediata</p>
                          </div>
                          <TrendingDown className="w-12 h-12 text-red-400" />
                        </div>
                      </div>
                    </div>

                    {lowStockItems.length > 0 && (
                      <div className="bg-yellow-900/30 border-2 border-yellow-500 rounded-lg p-6 mb-6 stock-alert">
                        <h3 className="text-xl font-bold text-yellow-300 mb-4 flex items-center gap-2">
                          <AlertTriangle /> ⚠️ Productos con Stock Bajo
                        </h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          {lowStockItems.map(item => (
                            <div key={item.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${parseInt(item.cantidad) <= ((parseInt(item.stockMinimo) || 10) * 0.5) ? 'border-red-500' : 'border-yellow-500'}`}>
                              <div className="flex items-start justify-between">
                                <div className="flex-1">
                                  <p className="text-white font-bold">{item.modelo}</p>
                                  <p className="text-slate-400 text-sm flex items-center gap-1">
                                    <MapPin /> {item.ubicacion}
                                  </p>
                                  {item.equipo && (
                                    <p className="text-slate-500 text-xs">Equipo: {item.equipo}</p>
                                  )}
                                </div>
                                <div className="text-right">
                                  <p className={`text-2xl font-bold ${parseInt(item.cantidad) <= ((parseInt(item.stockMinimo) || 10) * 0.5) ? 'text-red-400' : 'text-yellow-400'}`}>
                                    {item.cantidad}
                                  </p>
                                  <p className="text-slate-400 text-xs">Min: {item.stockMinimo || 10}</p>
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-6 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                        <h3 className="text-lg font-bold text-white mb-4">📊 Top 5 Mayor Stock</h3>
                        <div className="space-y-3">
                          {[...inventory].sort((a, b) => parseInt(b.cantidad) - parseInt(a.cantidad)).slice(0, 5).map((item, i) => (
                            <div key={item.id} className="flex items-center justify-between">
                              <div className="flex items-center gap-3 flex-1">
                                <span className="text-2xl font-bold text-blue-400">#{i + 1}</span>
                                <div>
                                  <p className="text-white font-semibold">{item.modelo}</p>
                                  <p className="text-slate-400 text-sm flex items-center gap-1">
                                    <MapPin /> {item.ubicacion}
                                  </p>
                                </div>
                              </div>
                              <span className="text-xl font-bold text-green-400">{item.cantidad}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-6 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                        <h3 className="text-lg font-bold text-white mb-4">📍 Ubicaciones ({stats.locations})</h3>
                        <div className="space-y-3">
                          {[...new Set(inventory.map(i => i.ubicacion))].slice(0, 5).map((loc, i) => {
                            const count = inventory.filter(item => item.ubicacion === loc).length;
                            const totalQty = inventory.filter(item => item.ubicacion === loc).reduce((sum, item) => sum + parseInt(item.cantidad), 0);
                            return (
                              <div key={i} className="flex items-center justify-between">
                                <div>
                                  <p className="text-white font-semibold">{loc}</p>
                                  <p className="text-slate-400 text-xs">{totalQty} unidades totales</p>
                                </div>
                                <span className="bg-blue-600 text-white px-3 py-1 rounded-full text-sm font-semibold">{count} items</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* HISTORIAL */}
                {currentUser?.role === 'admin' && showHistory && (
                  <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                    <div className="flex items-center justify-between mb-4">
                      <h2 className="text-xl font-bold text-white flex items-center gap-2">
                        <History /> Historial de Cambios
                      </h2>
                      <button onClick={() => setShowHistory(false)}
                        className="text-slate-400 hover:text-white">
                        <XCircle />
                      </button>
                    </div>
                    <div className="max-h-96 overflow-y-auto space-y-2">
                      {changeHistory.length === 0 ? (
                        <p className="text-slate-400 text-center py-8">No hay historial disponible</p>
                      ) : (
                        changeHistory.map(entry => (
                          <div key={entry.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                            <p className="text-white font-semibold">{entry.action}</p>
                            <p className="text-slate-300 text-sm mt-1">{entry.details}</p>
                            <div className="flex items-center gap-4 mt-2 text-xs text-slate-400">
                              <span>👤 {entry.user}</span>
                              <span>📧 {entry.userEmail}</span>
                              <span>🕐 {entry.timestamp}</span>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>
                )}

                {/* SOLICITUDES DE USUARIOS */}
                {currentUser?.role === 'admin' && pendingUsers.length > 0 && (
                  <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                    <h2 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                      <Bell /> Solicitudes de Cuenta ({pendingUsers.length})
                    </h2>
                    <div className="space-y-3">
                      {pendingUsers.map(user => (
                        <div key={user.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                          <div className="flex items-start justify-between gap-4 flex-wrap">
                            <div className="flex-1">
                              <p className="text-white font-semibold">{user.name}</p>
                              <p className="text-slate-400 text-sm">{user.email}</p>
                              {user.comment && (
                                <p className="text-slate-300 text-sm mt-2 italic">💬 "{user.comment}"</p>
                              )}
                              <p className="text-slate-500 text-xs mt-1">Solicitado: {user.requestDate}</p>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => approveUser(user.id)}
                                className="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">
                                <CheckCircle /> Aprobar
                              </button>
                              <button onClick={() => rejectUser(user.id)}
                                className="flex items-center gap-1 bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">
                                <XCircle /> Rechazar
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SOLICITUDES DE MATERIAL */}
                {currentUser?.role === 'admin' && pendingMaterials.length > 0 && (
                  <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                    <h2 className="text-xl font-bold text-white mb-4">📄 Solicitudes de Material ({pendingMaterials.length})</h2>
                    <div className="space-y-3">
                      {pendingMaterials.map(material => (
                        <div key={material.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                          <div className="flex items-start justify-between gap-4 flex-wrap">
                            <div className="flex-1">
                              <p className="text-white font-bold text-lg">{material.modelo}</p>
                              <div className="grid grid-cols-2 gap-2 mt-2 text-sm">
                                <p className="text-slate-300">📦 Equipo: {material.equipo || '-'}</p>
                                <p className="text-slate-300">🔢 Cantidad: {material.cantidad}</p>
                                <p className="text-slate-300 flex items-center gap-1">
                                  <MapPin /> Ubicación: <span className="text-blue-400">{material.ubicacion}</span>
                                </p>
                                <p className="text-slate-300">⚙️ Op. Actual: {material.operacionActual || '-'}</p>
                              </div>
                              <div className="flex items-center gap-4 mt-2 text-xs text-slate-500">
                                <span>👤 {material.requestedBy}</span>
                                <span>🕐 {material.requestDate}</span>
                              </div>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => approveMaterial(material.id)}
                                className="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">
                                <CheckCircle /> Aprobar
                              </button>
                              <button onClick={() => rejectMaterial(material.id)}
                                className="flex items-center gap-1 bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">
                                <XCircle /> Rechazar
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* FORMULARIO */}
                <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                  <h2 className="text-xl font-bold text-white mb-4">
                    {editingItem ? '✏️ Editar Material' : '➕ Solicitar Agregar Material'}
                  </h2>
                  <form onSubmit={editingItem ? handleUpdateMaterial : handleRequestMaterial} 
                        className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Modelo *</label>
                      <input type="text" value={formData.modelo}
                        onChange={(e) => setFormData({ ...formData, modelo: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="ABC-123" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Equipo</label>
                      <input type="text" value={formData.equipo}
                        onChange={(e) => setFormData({ ...formData, equipo: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Nombre" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Cantidad *</label>
                      <input type="number" value={formData.cantidad}
                        onChange={(e) => setFormData({ ...formData, cantidad: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="0" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Ubicación *</label>
                      <input type="text" value={formData.ubicacion}
                        onChange={(e) => setFormData({ ...formData, ubicacion: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Rack A-5" required />
                    </div>
                    {currentUser?.role === 'admin' && editingItem && (
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">
                          Stock Mínimo 🔒 <span className="text-xs text-yellow-400">(Solo Admin)</span>
                        </label>
                        <input type="number" value={formData.stockMinimo}
                          onChange={(e) => setFormData({ ...formData, stockMinimo: e.target.value })}
                          className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border border-yellow-600 rounded-lg text-white focus:ring-2 focus:ring-yellow-500`}
                          placeholder="10" />
                      </div>
                    )}
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Op. Actual</label>
                      <input type="text" value={formData.operacionActual}
                        onChange={(e) => setFormData({ ...formData, operacionActual: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Ensamblaje" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Próxima Op.</label>
                      <input type="text" value={formData.proximaOperacion}
                        onChange={(e) => setFormData({ ...formData, proximaOperacion: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Inspección" />
                    </div>
                    <div className="md:col-span-2 lg:col-span-3">
                      <label className="block text-sm font-medium text-slate-300 mb-2">Comentario</label>
                      <textarea value={formData.comentario}
                        onChange={(e) => setFormData({ ...formData, comentario: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Notas..." rows="2"></textarea>
                    </div>
                    <div className="md:col-span-2 lg:col-span-3 flex gap-2">
                      <button type="submit"
                        className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold">
                        <Plus /> {editingItem ? 'Actualizar' : 'Solicitar'}
                      </button>
                      {editingItem && (
                        <button type="button" onClick={() => {
                          setEditingItem(null);
                          setFormData({
                            modelo: '', equipo: '', cantidad: '', ubicacion: '', 
                            operacionActual: '', proximaOperacion: '', comentario: '', stockMinimo: '10'
                          });
                        }}
                          className="bg-slate-600 hover:bg-slate-700 text-white px-6 py-2 rounded-lg font-semibold">
                          Cancelar
                        </button>
                      )}
                    </div>
                  </form>
                </div>

                {/* TABLA DE INVENTARIO */}
                <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                  <div className="flex items-center justify-between mb-4 flex-wrap gap-4">
                    <h2 className="text-xl font-bold text-white">📦 Inventario ({inventory.length} registros)</h2>
                    <div className="relative">
                      <Search />
                      <input type="text" value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className={`pl-10 pr-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Buscar..." />
                    </div>
                  </div>

                  {filteredInventory.length === 0 ? (
                    <div className="text-center py-12">
                      <Package className="w-16 h-16 text-slate-600 mx-auto" />
                      <p className="text-slate-400 mt-4">No hay items</p>
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className={`border-b ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Modelo</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Equipo</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Cantidad</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Ubicación</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Stock Mín</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Estado</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Acciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredInventory.map((item) => {
                            const isLow = parseInt(item.cantidad) <= (parseInt(item.stockMinimo) || 10);
                            const isCritical = parseInt(item.cantidad) <= ((parseInt(item.stockMinimo) || 10) * 0.5);
                            
                            return (
                              <tr key={item.id} className={`border-b ${darkMode ? 'border-slate-700/50' : 'border-slate-700/50'} hover:bg-slate-900/30`}>
                                <td className="py-3 px-3 text-white font-medium">{item.modelo}</td>
                                <td className="py-3 px-3 text-slate-300">{item.equipo || '-'}</td>
                                <td className="py-3 px-3">
                                  <div className="flex items-center gap-2">
                                    <button onClick={() => handleAdjustQuantity(item.id, -1)}
                                      className="w-6 h-6 bg-red-600 hover:bg-red-700 text-white rounded flex items-center justify-center text-xs">
                                      -
                                    </button>
                                    <span className={`font-semibold min-w-[30px] text-center ${isCritical ? 'text-red-400' : isLow ? 'text-yellow-400' : 'text-white'}`}>
                                      {item.cantidad}
                                    </span>
                                    <button onClick={() => handleAdjustQuantity(item.id, 1)}
                                      className="w-6 h-6 bg-green-600 hover:bg-green-700 text-white rounded flex items-center justify-center text-xs">
                                      +
                                    </button>
                                  </div>
                                </td>
                                <td className="py-3 px-3">
                                  <span className="text-blue-400 font-medium flex items-center gap-1">
                                    <MapPin /> {item.ubicacion}
                                  </span>
                                </td>
                                <td className="py-3 px-3 text-slate-400">{item.stockMinimo || 10}</td>
                                <td className="py-3 px-3">
                                  {isCritical ? (
                                    <span className="bg-red-600 text-white px-2 py-1 rounded text-xs font-semibold animate-pulse">
                                      🔴 CRÍTICO
                                    </span>
                                  ) : isLow ? (
                                    <span className="bg-yellow-600 text-white px-2 py-1 rounded text-xs font-semibold">
                                      ⚠️ BAJO
                                    </span>
                                  ) : (
                                    <span className="bg-green-600 text-white px-2 py-1 rounded text-xs font-semibold">
                                      ✓ OK
                                    </span>
                                  )}
                                </td>
                                <td className="py-3 px-3">
                                  <div className="flex gap-2">
                                    <button onClick={() => handleEdit(item)}
                                      className="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded">
                                      <Edit2 />
                                    </button>
                                    {currentUser?.role === 'admin' && (
                                      <button onClick={() => handleDelete(item.id)}
                                        className="p-2 bg-red-600 hover:bg-red-700 text-white rounded">
                                        <Trash2 />
                                      </button>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InventoryApp />);
    </script>
</body>
</html>
