        if (isFirebaseConfigured) {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                firebaseInitialized = true;
                console.log('✅ Firebase inicializado');
            } catch (error) {
                console.error('❌ Error Firebase:', error);
            }
        } else {
            console.warn('⚠️ Firebase no configurado - Modo local');
        }

        // ==================== STORAGE WRAPPER ====================
        window.storage = {
            async get(key) {
                if (firebaseInitialized) {
                    try {
                        const snapshot = await database.ref(key).once('value');
                        const value = snapshot.val();
                        return value ? { key, value: JSON.stringify(value) } : null;
                    } catch (error) {
                        console.error('Error Firebase get:', error);
                        return null;
                    }
                } else {
                    try {
                        const value = localStorage.getItem(key);
                        return value ? { key, value } : null;
                    } catch (error) {
                        return null;
                    }
                }
            },

            async set(key, value) {
                if (firebaseInitialized) {
                    try {
                        const data = typeof value === 'string' ? JSON.parse(value) : value;
                        await database.ref(key).set(data);
                        return { key, value: JSON.stringify(data) };
                    } catch (error) {
                        console.error('Error Firebase set:', error);
                        return null;
                    }
                } else {
                    try {
                        localStorage.setItem(key, value);
                        return { key, value };
                    } catch (error) {
                        return null;
                    }
                }
            },

            async delete(key) {
                if (firebaseInitialized) {
                    try {
                        await database.ref(key).remove();
                        return { key, deleted: true };
                    } catch (error) {
                        console.error('Error Firebase delete:', error);
                        return null;
                    }
                } else {
                    try {
                        localStorage.removeItem(key);
                        return { key, deleted: true };
                    } catch (error) {
                        return null;
                    }
                }
            },

            onValue(key, callback) {
                if (firebaseInitialized) {
                    return database.ref(key).on('value', (snapshot) => {
                        callback(snapshot.val());
                    });
                }
                return null;
            },

            off(key) {
                if (firebaseInitialized) {
                    database.ref(key).off();
                }
            }
        };

        async function sendEmail(to, subject, message) {
            console.log('📧 Email simulado:', to, subject);

        }

          );

          const getLowStockItems = () => {

          };

          const getCriticalStockItems = () => {

          };

          const getStats = () => {
            const totalRecords = inventory.length;
            const totalQuantity = inventory.reduce((sum, item) => sum + parseInt(item.cantidad), 0);
            const lowStock = getLowStockItems().length;
            const critical = getCriticalStockItems().length;
            const locations = [...new Set(inventory.map(i => i.ubicacion))].length;
            const uniqueModels = [...new Set(inventory.map(i => i.modelo))].length;

            return { 
              totalRecords,
              totalQuantity,
              uniqueModels,
              lowStock, 
              critical, 
              locations 
            };
          };

          // ==================== FUNCIONES DE ANÁLISIS AVANZADO ====================
          
          // Obtener número de semana del año
          const getWeekNumber = (date) => {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
          };

          // Obtener semana actual
          const getCurrentWeek = () => {
            const now = new Date();
            return {
              week: getWeekNumber(now),
              year: now.getFullYear(),
              display: `Semana ${getWeekNumber(now)} - ${now.getFullYear()}`
            };
          };

          // Obtener todas las semanas con datos
          const getAllWeeks = () => {
            const weeksMap = {};
            
            changeHistory.forEach(entry => {
              if (entry.date) {
                const date = new Date(entry.date);
                const week = getWeekNumber(date);
                const year = date.getFullYear();
                const key = `${year}-W${week}`;
                
                if (!weeksMap[key]) {
                  weeksMap[key] = {
                    week,
                    year,
                    key,
                    display: `Semana ${week} - ${year}`,
                    entries: [],
                    stats: {
                      total: 0,
                      byOperation: {},
                      byUser: {},
                      entriesCount: 0,
                      exitsCount: 0,
                      editsCount: 0,
                      quantitiesAdded: 0,
                      quantitiesRemoved: 0,
                      quantitiesEdited: 0
                    }
                  };
                }
                
                weeksMap[key].entries.push(entry);
                weeksMap[key].stats.total++;
                
                // Extraer cantidad del details
                const quantityMatch = entry.details.match(/(\d+)\s*unidades?/i);
                const quantity = quantityMatch ? parseInt(quantityMatch[1]) : 0;
                
                // Contar por tipo y acumular cantidades
                if (entry.action.includes('agregó') || entry.action.includes('Aprobación') || entry.action.includes('Importación')) {
                  weeksMap[key].stats.entriesCount++;
                  weeksMap[key].stats.quantitiesAdded += quantity;
                } else if (entry.action.includes('eliminó')) {
                  weeksMap[key].stats.exitsCount++;
                  weeksMap[key].stats.quantitiesRemoved += quantity;
                } else if (entry.action.includes('editó') || entry.action.includes('ajustó')) {
                  weeksMap[key].stats.editsCount++;
                  weeksMap[key].stats.quantitiesEdited += quantity;
                }
                
                // Contar por usuario
                const userKey = entry.userEmail || entry.user;
                weeksMap[key].stats.byUser[userKey] = (weeksMap[key].stats.byUser[userKey] || 0) + 1;
                
                // Contar por operación
                const operation = entry.action;
                weeksMap[key].stats.byOperation[operation] = (weeksMap[key].stats.byOperation[operation] || 0) + 1;
              }
            });
            
            // Ordenar por semana más reciente
            return Object.values(weeksMap).sort((a, b) => {
              if (a.year !== b.year) return b.year - a.year;
              return b.week - a.week;
            });
          };

          // Filtrar entradas de semanas
          const filterWeekEntries = (entries) => {
            return entries.filter(entry => {
              const details = entry.details.toLowerCase();
              
              const matchModelo = !weekFilterModelo || 
                details.includes(weekFilterModelo.toLowerCase());
              
              const matchUbicacion = !weekFilterUbicacion || 
                details.includes(weekFilterUbicacion.toLowerCase());
              
              const matchOperacion = !weekFilterOperacion || 
                details.includes(weekFilterOperacion.toLowerCase());
              
              const matchEquipo = !weekFilterEquipo || 
                details.includes(weekFilterEquipo.toLowerCase());
              
              return matchModelo && matchUbicacion && matchOperacion && matchEquipo;
            });
          };

          // Obtener estadísticas de semana específica
          const getWeekStats = (weekKey) => {
            const weeks = getAllWeeks();
            return weeks.find(w => w.key === weekKey);
          };

          // Obtener datos para gráfica acumulativa
          const getWeeklyCumulativeData = () => {
            const weeks = getAllWeeks().reverse(); // Más antigua a más reciente
            let cumulative = 0;
            
            return weeks.map(week => {
              cumulative += week.stats.total;
              return {
                ...week,
                cumulative,
                weekLabel: `S${week.week}`
              };
            });
          };

          // Comparar semanas
          const compareWeeks = (week1Key, week2Key) => {
            const week1 = getWeekStats(week1Key);
            const week2 = getWeekStats(week2Key);
            
            if (!week1 || !week2) return null;
            
            return {
              week1: week1.display,
              week2: week2.display,
              totalDiff: week1.stats.total - week2.stats.total,
              entriesDiff: week1.stats.entriesCount - week2.stats.entriesCount,
              exitsDiff: week1.stats.exitsCount - week2.stats.exitsCount,
              editsDiff: week1.stats.editsCount - week2.stats.editsCount,
              percentChange: ((week1.stats.total - week2.stats.total) / week2.stats.total * 100).toFixed(1)
            };
          };
          
          // Filtrar historial
          const getFilteredHistory = () => {
            return changeHistory.filter(entry => {
              const matchUser = !historyFilterUser || 
                entry.userEmail.toLowerCase().includes(historyFilterUser.toLowerCase()) ||
                entry.user.toLowerCase().includes(historyFilterUser.toLowerCase());
              
              const matchDate = () => {
                if (!historyFilterStartDate && !historyFilterEndDate) return true;
                const entryDate = new Date(entry.date);
                const startDate = historyFilterStartDate ? new Date(historyFilterStartDate) : null;
                const endDate = historyFilterEndDate ? new Date(historyFilterEndDate + 'T23:59:59') : null;
                
                if (startDate && endDate) {
                  return entryDate >= startDate && entryDate <= endDate;
                } else if (startDate) {
                  return entryDate >= startDate;
                } else if (endDate) {
                  return entryDate <= endDate;
                }
                return true;
              };
              
              return matchUser && matchDate();
            });
          };

          // Obtener actividad por usuario (entradas/salidas)
          const getUserActivity = (period = 'month') => {
            const now = new Date();
            const periodStart = new Date();
            
            if (period === 'week') {
              periodStart.setDate(now.getDate() - 7);
            } else if (period === 'month') {
              periodStart.setMonth(now.getMonth() - 1);
            }
            
            const activityMap = {};
            
            changeHistory.forEach(entry => {
              const entryDate = new Date(entry.date);
              if (entryDate >= periodStart) {
                if (!activityMap[entry.userEmail]) {
                  activityMap[entry.userEmail] = {
                    name: entry.user,
                    email: entry.userEmail,
                    entries: 0,
                    exits: 0,
                    edits: 0,
                    total: 0
                  };
                }
                
                if (entry.action.includes('agregado') || entry.action.includes('Aprobación') || entry.action.includes('Importación')) {
                  activityMap[entry.userEmail].entries++;
                } else if (entry.action.includes('eliminado')) {
                  activityMap[entry.userEmail].exits++;
                } else if (entry.action.includes('editado') || entry.action.includes('ajustó')) {
                  activityMap[entry.userEmail].edits++;
                }
                
                activityMap[entry.userEmail].total++;
              }
            });
            
            return Object.values(activityMap).sort((a, b) => b.total - a.total);
          };

          // Obtener flujo de proceso por modelo
          const getProcessFlow = (modelo) => {
            if (!modelo) return [];
            
            const items = inventory.filter(item => 
              item.modelo.toLowerCase() === modelo.toLowerCase()
            );
            
            const flow = [];
            items.forEach(item => {
              if (item.operacionActual) {
                flow.push({
                  step: item.operacionActual,
                  nextStep: item.proximaOperacion || 'Finalizado',
                  location: item.ubicacion,
                  quantity: item.cantidad,
                  equipment: item.equipo
                });
              }
            });
            
            return flow;
          };

          // Material con más tiempo detenido
          const getStagnantMaterials = () => {

              const daysSinceActivity = Math.floor((now - lastActivityDate) / (1000 * 60 * 60 * 24));
              
              return {
                ...item,
                lastActivity: lastActivityDate,
                daysSinceActivity,
                lastAction: lastActivity?.action || 'Sin actividad'

                          <input
                            type="date"
                            value={historyFilterStartDate}
                            onChange={(e) => setHistoryFilterStartDate(e.target.value)}
                            className="w-full px-3 py-2 bg-slate-900/50 border border-slate-600 rounded text-white text-sm"
                          />
                        </div>
                        <div>
                          <label className="block text-xs text-slate-400 mb-1">Fecha Fin</label>
                          <input
                            type="date"
                            value={historyFilterEndDate}
                            onChange={(e) => setHistoryFilterEndDate(e.target.value)}
                            className="w-full px-3 py-2 bg-slate-900/50 border border-slate-600 rounded text-white text-sm"
                          />
                        </div>
                      </div>
                      {(historyFilterUser || historyFilterStartDate || historyFilterEndDate) && (
                        <button
                          onClick={() => {
                            setHistoryFilterUser('');
                            setHistoryFilterStartDate('');
                            setHistoryFilterEndDate('');
                          }}
                          className="mt-3 text-xs text-blue-400 hover:text-blue-300">
                          Limpiar filtros
                        </button>
                      )}
                    </div>
                    
                    <div className="max-h-96 overflow-y-auto space-y-2">
                      {getFilteredHistory().length === 0 ? (
                        <p className="text-slate-400 text-center py-8">
                          {changeHistory.length === 0 ? 'No hay historial disponible' : 'No se encontraron registros con estos filtros'}
                        </p>
                      ) : (
                        <>
                          <div className="mb-2 text-sm text-slate-400">
                            Mostrando {getFilteredHistory().length} de {changeHistory.length} registros
                          </div>
                          {getFilteredHistory().map(entry => (
                            <div key={entry.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                              <p className="text-white font-semibold">{entry.action}</p>
                              <p className="text-slate-300 text-sm mt-1">{entry.details}</p>
                              <div className="flex items-center gap-4 mt-2 text-xs text-slate-400">
                                <span>👤 {entry.user}</span>
                                <span>📧 {entry.userEmail}</span>
                                <span>🕐 {entry.timestamp}</span>
                              </div>
                            </div>
                          ))}
                        </>
                      )}
                    </div>
                  </div>
                )}

                {/* SOLICITUDES DE USUARIOS */}
                {currentUser?.role === 'admin' && pendingUsers.length > 0 && (
                  <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                    <h2 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                      <Bell /> Solicitudes de Cuenta ({pendingUsers.length})
                    </h2>
                    <div className="space-y-3">
                      {pendingUsers.map(user => (
                        <div key={user.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                          <div className="flex items-start justify-between gap-4 flex-wrap">
                            <div className="flex-1">
                              <p className="text-white font-semibold">{user.name}</p>
                              <p className="text-slate-400 text-sm">{user.email}</p>
                              {user.comment && (
                                <p className="text-slate-300 text-sm mt-2 italic">💬 "{user.comment}"</p>
                              )}
                              <p className="text-slate-500 text-xs mt-1">Solicitado: {user.requestDate}</p>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => approveUser(user.id)}
                                className="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">
                                <CheckCircle /> Aprobar
                              </button>
                              <button onClick={() => rejectUser(user.id)}
                                className="flex items-center gap-1 bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">
                                <XCircle /> Rechazar
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* SOLICITUDES DE MATERIAL */}
                {currentUser?.role === 'admin' && pendingMaterials.length > 0 && (
                  <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                    <h2 className="text-xl font-bold text-white mb-4">📄 Solicitudes de Material ({pendingMaterials.length})</h2>
                    <div className="space-y-3">
                      {pendingMaterials.map(material => (
                        <div key={material.id} className={`${darkMode ? 'bg-slate-900/50' : 'bg-slate-800/50'} p-4 rounded-lg border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                          <div className="flex items-start justify-between gap-4 flex-wrap">
                            <div className="flex-1">
                              <p className="text-white font-bold text-lg">{material.modelo}</p>
                              <div className="grid grid-cols-2 gap-2 mt-2 text-sm">
                                <p className="text-slate-300">📦 Equipo: {material.equipo || '-'}</p>
                                <p className="text-slate-300">🔢 Cantidad: {material.cantidad}</p>
                                <p className="text-slate-300 flex items-center gap-1">
                                  <MapPin /> Ubicación: <span className="text-blue-400">{material.ubicacion}</span>
                                </p>
                                <p className="text-slate-300">⚙️ Op. Actual: {material.operacionActual || '-'}</p>
                              </div>
                              <div className="flex items-center gap-4 mt-2 text-xs text-slate-500">
                                <span>👤 {material.requestedBy}</span>
                                <span>🕐 {material.requestDate}</span>
                              </div>
                            </div>
                            <div className="flex gap-2">
                              <button onClick={() => approveMaterial(material.id)}
                                className="flex items-center gap-1 bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm">
                                <CheckCircle /> Aprobar
                              </button>
                              <button onClick={() => rejectMaterial(material.id)}
                                className="flex items-center gap-1 bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm">
                                <XCircle /> Rechazar
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* FORMULARIO */}
                <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                  <h2 className="text-xl font-bold text-white mb-4">
                    {editingItem ? '✏️ Editar Material' : '➕ Solicitar Agregar Material'}
                  </h2>
                  <form onSubmit={editingItem ? handleUpdateMaterial : handleRequestMaterial} 
                        className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Modelo *</label>
                      <input type="text" value={formData.modelo}
                        onChange={(e) => setFormData({ ...formData, modelo: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="ABC-123" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Equipo</label>
                      <input type="text" value={formData.equipo}
                        onChange={(e) => setFormData({ ...formData, equipo: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Nombre" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Cantidad *</label>
                      <input type="number" value={formData.cantidad}
                        onChange={(e) => setFormData({ ...formData, cantidad: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="0" required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Ubicación *</label>
                      <input type="text" value={formData.ubicacion}
                        onChange={(e) => setFormData({ ...formData, ubicacion: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Rack A-5" required />
                    </div>
                    {currentUser?.role === 'admin' && editingItem && (
                      <div>
                        <label className="block text-sm font-medium text-slate-300 mb-2">
                          Stock Mínimo 🔒 <span className="text-xs text-yellow-400">(Solo Admin)</span>
                        </label>
                        <input type="number" value={formData.stockMinimo}
                          onChange={(e) => setFormData({ ...formData, stockMinimo: e.target.value })}
                          className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border border-yellow-600 rounded-lg text-white focus:ring-2 focus:ring-yellow-500`}
                          placeholder="10" />
                      </div>
                    )}
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Op. Actual</label>
                      <input type="text" value={formData.operacionActual}
                        onChange={(e) => setFormData({ ...formData, operacionActual: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Ensamblaje" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-300 mb-2">Próxima Op.</label>
                      <input type="text" value={formData.proximaOperacion}
                        onChange={(e) => setFormData({ ...formData, proximaOperacion: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Inspección" />
                    </div>
                    <div className="md:col-span-2 lg:col-span-3">
                      <label className="block text-sm font-medium text-slate-300 mb-2">Comentario</label>
                      <textarea value={formData.comentario}
                        onChange={(e) => setFormData({ ...formData, comentario: e.target.value })}
                        className={`w-full px-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Notas..." rows="2"></textarea>
                    </div>
                    <div className="md:col-span-2 lg:col-span-3 flex gap-2">
                      <button type="submit"
                        className="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-semibold">
                        <Plus /> {editingItem ? 'Actualizar' : 'Solicitar'}
                      </button>
                      {editingItem && (
                        <button type="button" onClick={() => {
                          setEditingItem(null);
                          setFormData({
                            modelo: '', equipo: '', cantidad: '', ubicacion: '', 
                            operacionActual: '', proximaOperacion: '', comentario: '', stockMinimo: '10'
                          });
                        }}
                          className="bg-slate-600 hover:bg-slate-700 text-white px-6 py-2 rounded-lg font-semibold">
                          Cancelar
                        </button>
                      )}
                    </div>
                  </form>
                </div>

                {/* TABLA DE INVENTARIO */}
                <div className={`${darkMode ? 'bg-slate-900/70' : 'bg-slate-800/50'} backdrop-blur-xl rounded-xl p-6 border ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                  <div className="flex items-center justify-between mb-4 flex-wrap gap-4">
                    <h2 className="text-xl font-bold text-white">📦 Inventario ({inventory.length} registros)</h2>
                    <div className="relative">
                      <Search />
                      <input type="text" value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className={`pl-10 pr-4 py-2 ${darkMode ? 'bg-slate-900/50' : 'bg-slate-900/50'} border ${darkMode ? 'border-slate-600' : 'border-slate-600'} rounded-lg text-white focus:ring-2 focus:ring-blue-500`}
                        placeholder="Buscar..." />
                    </div>
                  </div>

                  {filteredInventory.length === 0 ? (
                    <div className="text-center py-12">
                      <Package className="w-16 h-16 text-slate-600 mx-auto" />
                      <p className="text-slate-400 mt-4">No hay items</p>
                    </div>
                  ) : (
                    <div className="overflow-x-auto">
                      <table className="w-full text-sm">
                        <thead>
                          <tr className={`border-b ${darkMode ? 'border-slate-700' : 'border-slate-700'}`}>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Modelo</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Equipo</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Cantidad</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Ubicación</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Stock Mín</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Estado</th>
                            <th className="text-left py-3 px-3 text-slate-300 font-semibold">Acciones</th>
                          </tr>
                        </thead>
                        <tbody>
                          {filteredInventory.map((item) => {
                            const isLow = parseInt(item.cantidad) <= (parseInt(item.stockMinimo) || 10);
                            const isCritical = parseInt(item.cantidad) <= ((parseInt(item.stockMinimo) || 10) * 0.5);
                            
                            return (
                              <tr key={item.id} className={`border-b ${darkMode ? 'border-slate-700/50' : 'border-slate-700/50'} hover:bg-slate-900/30`}>
                                <td className="py-3 px-3 text-white font-medium">{item.modelo}</td>
                                <td className="py-3 px-3 text-slate-300">{item.equipo || '-'}</td>
                                <td className="py-3 px-3">
                                  <div className="flex items-center gap-2">
                                    <button onClick={() => handleAdjustQuantity(item.id, -1)}
                                      className="w-6 h-6 bg-red-600 hover:bg-red-700 text-white rounded flex items-center justify-center text-xs">
                                      -
                                    </button>
                                    <span className={`font-semibold min-w-[30px] text-center ${isCritical ? 'text-red-400' : isLow ? 'text-yellow-400' : 'text-white'}`}>
                                      {item.cantidad}
                                    </span>
                                    <button onClick={() => handleAdjustQuantity(item.id, 1)}
                                      className="w-6 h-6 bg-green-600 hover:bg-green-700 text-white rounded flex items-center justify-center text-xs">
                                      +
                                    </button>
                                  </div>
                                </td>
                                <td className="py-3 px-3">
                                  <span className="text-blue-400 font-medium flex items-center gap-1">
                                    <MapPin /> {item.ubicacion}
                                  </span>
                                </td>
                                <td className="py-3 px-3 text-slate-400">{item.stockMinimo || 10}</td>
                                <td className="py-3 px-3">
                                  {isCritical ? (
                                    <span className="bg-red-600 text-white px-2 py-1 rounded text-xs font-semibold animate-pulse">
                                      🔴 CRÍTICO
                                    </span>
                                  ) : isLow ? (
                                    <span className="bg-yellow-600 text-white px-2 py-1 rounded text-xs font-semibold">
                                      ⚠️ BAJO
                                    </span>
                                  ) : (
                                    <span className="bg-green-600 text-white px-2 py-1 rounded text-xs font-semibold">
                                      ✓ OK
                                    </span>
                                  )}
                                </td>
                                <td className="py-3 px-3">
                                  <div className="flex gap-2">
                                    <button onClick={() => handleEdit(item)}
                                      className="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded">
                                      <Edit2 />
                                    </button>
                                    {currentUser?.role === 'admin' && (
                                      <button onClick={() => handleDelete(item.id)}
                                        className="p-2 bg-red-600 hover:bg-red-700 text-white rounded">
                                        <Trash2 />
                                      </button>
                                    )}
                                  </div>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<InventoryApp />);
    </script>
</body>
</html>
