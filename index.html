    } else {

    }

    // ==================== STORAGE WRAPPER ====================
    window.storage = {
      async get(key) {
        if (firebaseInitialized) {
          try {
            const snapshot = await database.ref(key).once('value');
            const value = snapshot.val();
            return value ? { key, value: JSON.stringify(value) } : null;
          } catch (error) {
            console.error('Error Firebase get:', error);
            return null;
          }
        } else {
          try {
            const value = localStorage.getItem(key);
            return value ? { key, value } : null;
          } catch (error) {
            return null;
          }
        }
      },

      async set(key, value) {
        if (firebaseInitialized) {
          try {
            const data = typeof value === 'string' ? JSON.parse(value) : value;
            await database.ref(key).set(data);
            return { key, value: JSON.stringify(data) };
          } catch (error) {
            console.error('Error Firebase set:', error);
            return null;
          }
        } else {
          try {
            localStorage.setItem(key, value);
            return { key, value };
          } catch (error) {
            return null;
          }
        }
      },

      async delete(key) {
        if (firebaseInitialized) {
          try {
            await database.ref(key).remove();
            return { key, deleted: true };
          } catch (error) {
            console.error('Error Firebase delete:', error);
            return null;
          }
        } else {
          try {
            localStorage.removeItem(key);
            return { key, deleted: true };
          } catch (error) {
            return null;
          }
        }
      },

      onValue(key, callback) {
        if (firebaseInitialized) {
          return database.ref(key).on('value', (snapshot) => {
            callback(snapshot.val());
          });
        }
        return null;
      },

      off(key) {
        if (firebaseInitialized) {
          database.ref(key).off();
        }
      }
    };

    async function sendEmail(to, subject, message) {

          if (!modelGroups[item.modelo]) {

              locations: [],
              stockMinimo: parseInt(item.stockMinimo) || 10,
              stockMaximo: parseInt(item.stockMaximo) || 100

          data.total <= data.stockMinimo

        if (lowStockModels.length > 0 && currentUser?.role === 'admin') {
          const items = lowStockModels.map(([modelo, data]) =>
            `${modelo}: ${data.total}u (Mín: ${data.stockMinimo}) en ${data.locations.length} ubicación(es)`
          ).join('\n');
          setTimeout(() => {
            alert(`⚠️ ALERTA DE STOCK BAJO:\n\n${items}\n\nRevisa el dashboard para más detalles.`);
          }, 500);
        }

        if (highStockModels.length > 0 && currentUser?.role === 'admin') {
          const items = highStockModels.map(([modelo, data]) =>
            `${modelo}: ${data.total}u (Máx: ${data.stockMaximo}) en ${data.locations.length} ubicación(es)`
          ).join('\n');
          setTimeout(() => {
            alert(`📦 ALERTA DE STOCK ALTO:\n\n${items}\n\nExcede el stock máximo.`);
          }, 1000);
        }
      };

      const exportToExcel = () => {
        if (inventory.length === 0) {
          alert('No hay datos para exportar');
          return;
        }

        const wsData = [
          ['Modelo', 'Equipo', 'Cantidad', 'Stock Mínimo', 'Stock Máximo', 'Ubicación', 'Op. Actual', 'Próxima Op.', 'Comentario', 'Fecha', 'Creado Por'],
          ...inventory.map(item => [
            item.modelo,
            item.equipo || '-',
            item.cantidad,
            item.stockMinimo || 10,
            item.stockMaximo || 100,
            item.ubicacion,
            item.operacionActual || '-',
            item.proximaOperacion || '-',
            item.comentario || '-',
            item.fechaRegistro || '-',
            item.creadoPor || '-'
          ])
        ];

        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Inventario');

        XLSX.writeFile(wb, `inventario_${new Date().toISOString().split('T')[0]}.xlsx`);

        addToHistory('Exportación a Excel', `${currentUser.name} exportó el inventario`, currentUser);
      };

      const handleImportExcel = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            let imported = 0;
            let errors = 0;

            const newItems = jsonData.map((row, index) => {
              try {
                if (!row.Modelo || !row.Cantidad || !row.Ubicación) {
                  errors++;
                  return null;
                }

                imported++;
                return {
                  id: Date.now() + index,
                  modelo: row.Modelo || '',
                  equipo: row.Equipo || '',
                  cantidad: parseInt(row.Cantidad) || 0,
                  stockMinimo: parseInt(row['Stock Mínimo']) || 10,
                  stockMaximo: parseInt(row['Stock Máximo']) || 100,
                  ubicacion: row.Ubicación || '',
                  operacionActual: row['Op. Actual'] || '',
                  proximaOperacion: row['Próxima Op.'] || '',
                  comentario: row.Comentario || '',
                  fechaRegistro: new Date().toISOString(),
                  creadoPor: currentUser.name
                };
              } catch (err) {
                errors++;
                return null;
              }
            }).filter(item => item !== null);

            const updatedInventory = [...inventory, ...newItems];
            setInventory(updatedInventory);
            saveToStorage('inventory-data', updatedInventory);

            addToHistory('Importación masiva', `${currentUser.name} importó ${imported} productos`, currentUser);
            checkStockAlerts(updatedInventory);

            alert(`✅ Importación completada:\n\n✓ ${imported} productos importados\n${errors > 0 ? `✗ ${errors} filas con errores` : ''}`);

          } catch (error) {
            console.error('Error:', error);
            alert('❌ Error al importar el archivo. Verifica el formato.');
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      const filteredInventory = inventory.filter(item =>
        item.modelo.toLowerCase().includes(searchTerm.toLowerCase()) ||
        item.ubicacion.toLowerCase().includes(searchTerm.toLowerCase()) ||
        (item.equipo && item.equipo.toLowerCase().includes(searchTerm.toLowerCase()))
      );

      const getLowStockItems = () => {
        return inventory.filter(item => parseInt(item.cantidad) <= (parseInt(item.stockMinimo) || 10));
      };

      const getCriticalStockItems = () => {
        return inventory.filter(item => parseInt(item.cantidad) <= ((parseInt(item.stockMinimo) || 10) * 0.5));
      };

      const getStats = () => {
        const totalRecords = inventory.length;
        const totalQuantity = inventory.reduce((sum, item) => sum + parseInt(item.cantidad), 0);
        const lowStock = getLowStockItems().length;
        const critical = getCriticalStockItems().length;
        const locations = [...new Set(inventory.map(i => i.ubicacion))].length;
        const uniqueModels = [...new Set(inventory.map(i => i.modelo))].length;

        return {
          totalRecords,
          totalQuantity,
          uniqueModels,
          lowStock,
          critical,
          locations
        };
      };

      // ==================== FUNCIONES DE ANÁLISIS AVANZADO ====================

      // Obtener número de semana del año
      const getWeekNumber = (date) => {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
      };

      // Obtener semana actual
      const getCurrentWeek = () => {
        const now = new Date();
        return {
          week: getWeekNumber(now),
          year: now.getFullYear(),
          display: `Semana ${getWeekNumber(now)} - ${now.getFullYear()}`
        };
      };

      // Obtener todas las semanas con datos
      const getAllWeeks = () => {
        const weeksMap = {};

        changeHistory.forEach(entry => {
          if (entry.date) {
            const date = new Date(entry.date);
            const week = getWeekNumber(date);
            const year = date.getFullYear();
            const key = `${year}-W${week}`;

            if (!weeksMap[key]) {
              weeksMap[key] = {
                week,
                year,
                key,
                display: `Semana ${week} - ${year}`,
                entries: [],
                stats: {
                  total: 0,
                  byOperation: {},
                  byUser: {},
                  entriesCount: 0,
                  exitsCount: 0,
                  editsCount: 0,
                  quantitiesAdded: 0,
                  quantitiesRemoved: 0,
                  quantitiesEdited: 0
                }
              };
            }

            weeksMap[key].entries.push(entry);
            weeksMap[key].stats.total++;

            // Extraer cantidad del details
            const quantityMatch = entry.details.match(/(\d+)\s*unidades?/i);
            const quantity = quantityMatch ? parseInt(quantityMatch[1]) : 0;

            // Contar por tipo y acumular cantidades
            if (entry.action.includes('agregó') || entry.action.includes('Aprobación') || entry.action.includes('Importación')) {
              weeksMap[key].stats.entriesCount++;
              weeksMap[key].stats.quantitiesAdded += quantity;
            } else if (entry.action.includes('eliminó')) {
              weeksMap[key].stats.exitsCount++;
              weeksMap[key].stats.quantitiesRemoved += quantity;
            } else if (entry.action.includes('editó') || entry.action.includes('ajustó')) {
              weeksMap[key].stats.editsCount++;
              weeksMap[key].stats.quantitiesEdited += quantity;
            }

            // Contar por usuario
            const userKey = entry.userEmail || entry.user;
            weeksMap[key].stats.byUser[userKey] = (weeksMap[key].stats.byUser[userKey] || 0) + 1;

            // Contar por operación
            const operation = entry.action;
            weeksMap[key].stats.byOperation[operation] = (weeksMap[key].stats.byOperation[operation] || 0) + 1;
          }
        });

        // Ordenar por semana más reciente
        return Object.values(weeksMap).sort((a, b) => {
          if (a.year !== b.year) return b.year - a.year;
          return b.week - a.week;
        });
      };

      // Filtrar entradas de semanas
      const filterWeekEntries = (entries) => {
        return entries.filter(entry => {
          const details = entry.details.toLowerCase();

          const matchModelo = !weekFilterModelo ||
            details.includes(weekFilterModelo.toLowerCase());

          const matchUbicacion = !weekFilterUbicacion ||
            details.includes(weekFilterUbicacion.toLowerCase());

          const matchOperacion = !weekFilterOperacion ||
            details.includes(weekFilterOperacion.toLowerCase());

          const matchEquipo = !weekFilterEquipo ||
            details.includes(weekFilterEquipo.toLowerCase());

          return matchModelo && matchUbicacion && matchOperacion && matchEquipo;
        });
      };

      // Obtener cantidades de modelos por semana
      const getModelQuantitiesByWeek = () => {
        const weeksMap = {};

        // Iterar sobre el inventario actual
        inventory.forEach(item => {
          // Buscar cuándo fue agregado
          const addEntry = changeHistory.find(entry =>
            entry.action.includes('agregó') &&
            entry.details.toLowerCase().includes(item.modelo.toLowerCase()) &&
            entry.details.toLowerCase().includes(item.ubicacion.toLowerCase())
          );

          if (addEntry && addEntry.date) {
            const date = new Date(addEntry.date);
            const week = getWeekNumber(date);
            const year = date.getFullYear();
            const key = `${year}-W${week}`;

            if (!weeksMap[key]) {
              weeksMap[key] = {
                week,
                year,
                key,
                display: `Semana ${week} - ${year}`,
                models: {},
                byOperation: {},
                byNextOperation: {},
                totalQuantity: 0
              };
            }

            // Acumular por modelo
            if (!weeksMap[key].models[item.modelo]) {
              weeksMap[key].models[item.modelo] = 0;
            }
            weeksMap[key].models[item.modelo] += parseInt(item.cantidad) || 0;

            // Acumular por operación actual
            if (item.operacionActual) {
              if (!weeksMap[key].byOperation[item.operacionActual]) {
                weeksMap[key].byOperation[item.operacionActual] = 0;
              }
              weeksMap[key].byOperation[item.operacionActual] += parseInt(item.cantidad) || 0;
            }

            // Acumular por próxima operación
            if (item.proximaOperacion) {
              if (!weeksMap[key].byNextOperation[item.proximaOperacion]) {
                weeksMap[key].byNextOperation[item.proximaOperacion] = 0;
              }
              weeksMap[key].byNextOperation[item.proximaOperacion] += parseInt(item.cantidad) || 0;
            }

            weeksMap[key].totalQuantity += parseInt(item.cantidad) || 0;
          }
        });

        // Ordenar por semana más reciente
        return Object.values(weeksMap).sort((a, b) => {
          if (a.year !== b.year) return b.year - a.year;
          return b.week - a.week;
        });
      };

      // Filtrar datos de gráfica
      const filterChartData = (weeks) => {
        if (!chartFilterModelo && !chartFilterOperacion && !chartFilterUbicacion) {
          return weeks;
        }

        return weeks.map(week => {
          let filteredTotalQuantity = 0;
          const filteredModels = {};
          const filteredByOperation = {};
          const filteredByNextOperation = {};

          // Filtrar inventario de esta semana
          inventory.forEach(item => {
            const addEntry = changeHistory.find(entry =>
              entry.action.includes('agregó') &&
              entry.details.toLowerCase().includes(item.modelo.toLowerCase()) &&
              entry.details.toLowerCase().includes(item.ubicacion.toLowerCase())
            );

            if (addEntry && addEntry.date) {
              const date = new Date(addEntry.date);
              const itemWeek = getWeekNumber(date);
              const itemYear = date.getFullYear();

              if (itemWeek === week.week && itemYear === week.year) {
                const matchModelo = !chartFilterModelo ||
                  item.modelo.toLowerCase().includes(chartFilterModelo.toLowerCase());

                const matchOperacion = !chartFilterOperacion ||
                  (item.operacionActual && item.operacionActual.toLowerCase().includes(chartFilterOperacion.toLowerCase()));

                const matchUbicacion = !chartFilterUbicacion ||
                  item.ubicacion.toLowerCase().includes(chartFilterUbicacion.toLowerCase());

                if (matchModelo && matchOperacion && matchUbicacion) {
                  const qty = parseInt(item.cantidad) || 0;

                  if (!filteredModels[item.modelo]) {
                    filteredModels[item.modelo] = 0;
                  }
                  filteredModels[item.modelo] += qty;

                  if (item.operacionActual) {
                    if (!filteredByOperation[item.operacionActual]) {
                      filteredByOperation[item.operacionActual] = 0;
                    }
                    filteredByOperation[item.operacionActual] += qty;
                  }

                  if (item.proximaOperacion) {
                    if (!filteredByNextOperation[item.proximaOperacion]) {
                      filteredByNextOperation[item.proximaOperacion] = 0;
                    }
                    filteredByNextOperation[item.proximaOperacion] += qty;
                  }

                  filteredTotalQuantity += qty;
                }
              }
            }
          });

          return {
            ...week,
            models: filteredModels,
            byOperation: filteredByOperation,
            byNextOperation: filteredByNextOperation,
            totalQuantity: filteredTotalQuantity
          };
        });
      };

      // Obtener estadísticas de semana específica
      const getWeekStats = (weekKey) => {
        const weeks = getAllWeeks();
        return weeks.find(w => w.key === weekKey);
      };

      // Obtener datos para gráfica acumulativa
      const getWeeklyCumulativeData = () => {
        const weeks = getAllWeeks().reverse(); // Más antigua a más reciente
        let cumulative = 0;

        return weeks.map(week => {
          cumulative += week.stats.total;
          return {
            ...week,
            cumulative,
            weekLabel: `S${week.week}`
          };
        });
      };

      // Comparar semanas
      const compareWeeks = (week1Key, week2Key) => {
        const week1 = getWeekStats(week1Key);
        const week2 = getWeekStats(week2Key);

        if (!week1 || !week2) return null;

        return {
          week1: week1.display,
          week2: week2.display,
          totalDiff: week1.stats.total - week2.stats.total,
          entriesDiff: week1.stats.entriesCount - week2.stats.entriesCount,
          exitsDiff: week1.stats.exitsCount - week2.stats.exitsCount,
          editsDiff: week1.stats.editsCount - week2.stats.editsCount,
          percentChange: ((week1.stats.total - week2.stats.total) / week2.stats.total * 100).toFixed(1)
        };
      };

      // Filtrar historial
      const getFilteredHistory = () => {
        return changeHistory.filter(entry => {
          const matchUser = !historyFilterUser ||
            entry.userEmail.toLowerCase().includes(historyFilterUser.toLowerCase()) ||
            entry.user.toLowerCase().includes(historyFilterUser.toLowerCase());

          const matchDate = () => {
            if (!historyFilterStartDate && !historyFilterEndDate) return true;
            const entryDate = new Date(entry.date);
            const startDate = historyFilterStartDate ? new Date(historyFilterStartDate) : null;
            const endDate = historyFilterEndDate ? new Date(historyFilterEndDate + 'T23:59:59') : null;

            if (startDate && endDate) {
              return entryDate >= startDate && entryDate <= endDate;
            } else if (startDate) {
              return entryDate >= startDate;
            } else if (endDate) {
              return entryDate <= endDate;
            }
            return true;
          };

          return matchUser && matchDate();
        });
      };

      // Obtener actividad por usuario (entradas/salidas)
      const getUserActivity = (period = 'month') => {
        const now = new Date();
        const periodStart = new Date();

        if (period === 'week') {
          periodStart.setDate(now.getDate() - 7);
        } else if (period === 'month') {
          periodStart.setMonth(now.getMonth() - 1);
        }

        const activityMap = {};

        changeHistory.forEach(entry => {
          const entryDate = new Date(entry.date);
          if (entryDate >= periodStart) {
            if (!activityMap[entry.userEmail]) {
              activityMap[entry.userEmail] = {
                name: entry.user,
                email: entry.userEmail,
                entries: 0,
                exits: 0,
                edits: 0,
                total: 0
              };
            }

            if (entry.action.includes('agregado') || entry.action.includes('Aprobación') || entry.action.includes('Importación')) {
              activityMap[entry.userEmail].entries++;
            } else if (entry.action.includes('eliminado')) {
              activityMap[entry.userEmail].exits++;
            } else if (entry.action.includes('editado') || entry.action.includes('ajustó')) {
              activityMap[entry.userEmail].edits++;
            }

            activityMap[entry.userEmail].total++;
          }
        });

        return Object.values(activityMap).sort((a, b) => b.total - a.total);
      };

      // Obtener flujo de proceso por modelo
      const getProcessFlow = (modelo) => {
        if (!modelo) return [];

        const items = inventory.filter(item =>
          item.modelo.toLowerCase() === modelo.toLowerCase()
        );

        const flow = [];
        items.forEach(item => {
          if (item.operacionActual) {
            flow.push({
              step: item.operacionActual,
              nextStep: item.proximaOperacion || 'Finalizado',
              location: item.ubicacion,
              quantity: item.cantidad,
              equipment: item.equipo
            });
          }
        });

        return flow;
      };

      // Material con más tiempo detenido
      const getStagnantMaterials = () => {
        // Fecha actual solo con día (sin horas)
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        const materialsWithActivity = inventory.map(item => {
          // Buscar última actividad de este item en el historial
          const lastActivity = changeHistory
            .filter(entry =>
              entry.details.toLowerCase().includes(item.modelo.toLowerCase()) &&
              (entry.details.toLowerCase().includes(item.ubicacion.toLowerCase()) ||
                entry.action.includes('ajustó') ||
                entry.action.includes('editado') ||
                entry.action.includes('agregó'))
            )
            .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

          // Determinar fecha de última actividad
          let lastActivityDate;

          if (lastActivity && lastActivity.date) {
            // Usar fecha del historial
            const actDate = new Date(lastActivity.date);
            lastActivityDate = new Date(actDate.getFullYear(), actDate.getMonth(), actDate.getDate());
          } else if (item.fechaRegistro) {
            // Usar fecha de registro del item
            const regDate = new Date(item.fechaRegistro);
            lastActivityDate = new Date(regDate.getFullYear(), regDate.getMonth(), regDate.getDate());
          } else {
            // Si no hay fecha, usar hoy (material sin fecha)
            lastActivityDate = today;
          }

          // Calcular días transcurridos (nunca negativo)
          const millisDiff = today.getTime() - lastActivityDate.getTime();
          const daysSinceActivity = Math.max(0, Math.floor(millisDiff / (1000 * 60 * 60 * 24)));

          return {
            ...item,
            lastActivity: lastActivityDate,
            daysSinceActivity,
            lastAction: lastActivity?.action || 'Recién agregado'
          };
        });

        return materialsWithActivity
          .sort((a, b) => b.daysSinceActivity - a.daysSinceActivity)
          .slice(0, 10);
      };

      const ConnectionIndicator = () => (
        <div className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs ${connectionStatus === 'connected'
          ? 'bg-green-900/30 text-green-400 border border-green-500'
          : connectionStatus === 'local'
            ? 'bg-yellow-900/30 text-yellow-400 border border-yellow-500'
            : 'bg-red-900/30 text-red-400 border border-red-500'
          }`}>
          {connectionStatus === 'connected' ? <Cloud /> : <CloudOff />}
          {connectionStatus === 'connected' ? 'Sincronizado' : connectionStatus === 'local' ? 'Modo Local' : 'Sin conexión'}
        </div>
      );

      // ==================== VISTAS ====================
      if (view === 'login') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
            <div className="bg-slate-800/50 backdrop-blur-xl rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-700">
              <div className="flex flex-col items-center mb-8">
                <div className="bg-blue-600 p-4 rounded-full mb-4">
                  <Package className="w-10 h-10" />
                </div>
                <h1 className="text-3xl font-bold text-white mb-2">Sistema de Inventario</h1>
                <p className="text-slate-400">Inicia sesión para continuar</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Email</label>
                  <input type="email" name="email" required
                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="tu@email.com" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Contraseña</label>
                  <input type="password" name="password" required
                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="••••••••" />
                </div>
                <button type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition">
                  Iniciar Sesión
                </button>
              </form>
              <div className="mt-6 text-center">
                <button onClick={() => setView('register')}
                  className="text-blue-400 hover:text-blue-300 text-sm">
                  ¿No tienes cuenta? Solicitar acceso
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'register') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
            <div className="bg-slate-800/50 backdrop-blur-xl rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-700">
              <h1 className="text-3xl font-bold text-white mb-6 text-center">Solicitar Acceso</h1>
              <form onSubmit={handleRegister} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Nombre Completo *</label>
                  <input type="text" name="name" required
                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Juan Pérez" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Email *</label>
                  <input type="email" name="email" required
                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="tu@email.com" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Contraseña *</label>
                  <input type="password" name="password" required
                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="••••••••" />
                </div>
                <div>
                  <label className="block text-sm font-medium text-slate-300 mb-2">Comentario</label>
                  <textarea name="comment" rows="3"
                    className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Motivo de solicitud..."></textarea>
                </div>
                <button type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold transition">
                  Solicitar Acceso
                </button>
              </form>
              <div className="mt-6 text-center">
                <button onClick={() => setView('login')}
                  className="text-blue-400 hover:text-blue-300 text-sm">
                  Volver al inicio de sesión
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (view === 'pending') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">

                                </td>
                                <td className="py-4 px-4">
                                  {currentUser?.role === 'admin' && (
                                    <button
                                      onClick={async () => {
                                        const newMin = prompt(`Stock Mínimo para ${modelo}:`, data.stockMinimo);
                                        const newMax = prompt(`Stock Máximo para ${modelo}:`, data.stockMaximo);
                                        if (newMin && newMax) {
                                          const newConfig = {
                                            ...modelStockConfig,
                                            [modelo]: {
                                              stockMinimo: parseInt(newMin),
                                              stockMaximo: parseInt(newMax)
                                            }
                                          };
                                          setModelStockConfig(newConfig);
                                          await window.storage.set('model-stock-config', JSON.stringify(newConfig));

                                          // Actualizar todos los items del modelo
                                          const updatedInventory = inventory.map(item =>
                                            item.modelo === modelo
                                              ? { ...item, stockMinimo: parseInt(newMin), stockMaximo: parseInt(newMax) }
                                              : item
                                          );
                                          setInventory(updatedInventory);
                                          await saveToStorage('inventory-data', updatedInventory);
                                          alert(`✅ Stock actualizado para ${modelo}`);
                                        }
                                      }}
                                      className="bg-yellow-600 hover:bg-yellow-700 text-white px-3 py-1.5 rounded-md text-sm font-semibold transition-colors">
                                      ⚙️ Config
                                    </button>
                                  )}
                                </td>
                              </tr>

                              {/* FILAS DE UBICACIONES (solo si está expandido) */}
                              {isExpanded && data.items.map((item, idx) => (
                                <tr key={item.id} className={`border-b ${darkMode ? 'border-slate-700/50' : 'border-slate-700/50'} bg-slate-800/30`}>
                                  <td className="py-3 px-4 pl-12">
                                    <div className="flex items-center gap-2">
                                      <span className="text-slate-500">📍</span>
                                      <span className="text-slate-300 font-medium">{item.ubicacion}</span>
                                    </div>
                                  </td>
                                  <td className="py-3 px-4">
                                    <div className="flex items-center gap-2">
                                      <button onClick={() => handleAdjustQuantity(item.id, -1)}
                                        className="w-7 h-7 bg-red-600 hover:bg-red-700 text-white rounded-md flex items-center justify-center font-bold transition-colors">
                                        -
                                      </button>
                                      <span className="font-bold text-white text-lg min-w-[40px] text-center">{item.cantidad}</span>
                                      <button onClick={() => handleAdjustQuantity(item.id, 1)}
                                        className="w-7 h-7 bg-green-600 hover:bg-green-700 text-white rounded-md flex items-center justify-center font-bold transition-colors">
                                        +
                                      </button>
                                    </div>
                                  </td>
                                  <td className="py-3 px-4 text-slate-400 text-sm">
                                    {item.equipo || '-'}
                                  </td>
                                  <td className="py-3 px-4 text-slate-400 text-sm" colSpan="2">
                                    {item.operacionActual || '-'}
                                    {item.proximaOperacion && ` → ${item.proximaOperacion}`}
                                  </td>
                                  <td className="py-3 px-4 text-slate-400 text-sm">
                                    {item.comentario || '-'}
                                  </td>
                                  <td className="py-3 px-4">
                                    <div className="flex gap-2">
                                      <button onClick={() => handleEdit(item)}
                                        className="p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors">
                                        <Edit2 />
                                      </button>
                                      {currentUser?.role === 'admin' && (
                                        <button onClick={() => handleDelete(item.id)}
                                          className="p-2 bg-red-600 hover:bg-red-700 text-white rounded-md transition-colors">
                                          <Trash2 />
                                        </button>
                                      )}
                                    </div>
                                  </td>
                                </tr>
                              ))}
                            </React.Fragment>
                          );
                        });
                      })()}
                    </tbody>
                  </table>
                </div>
              )}

              <div className="mt-4 p-4 bg-blue-900/20 border border-blue-700 rounded-lg">
                <p className="text-blue-300 text-sm flex items-center gap-2">
                  <span className="text-lg">💡</span>
                  <strong>Tip:</strong> Haz clic en ▶ para expandir y ver todas las ubicaciones del modelo. El stock se calcula sumando todas las ubicaciones.
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<InventoryApp />);
  </script>
</body>

</html>
