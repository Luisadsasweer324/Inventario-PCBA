      const isFirebaseConfigured = true;
      let database = null;
      let firebaseInitialized = false;

      if (isFirebaseConfigured) {
        try {
          firebase.initializeApp(firebaseConfig);
          database = firebase.database();
          firebaseInitialized = true;
          console.log("✅ Firebase inicializado");
        } catch (error) {
          console.error("❌ Error Firebase:", error);
        }
      } else {
        console.warn("⚠️ Firebase no configurado - Modo local");
      }

      // ==================== STORAGE WRAPPER ====================
      window.storage = {
        async get(key) {
          if (firebaseInitialized) {
            try {
              const snapshot = await database.ref(key).once("value");
              const value = snapshot.val();
              return value ? { key, value: JSON.stringify(value) } : null;
            } catch (error) {
              console.error("Error Firebase get:", error);
              return null;
            }
          } else {
            try {
              const value = localStorage.getItem(key);
              return value ? { key, value } : null;
            } catch (error) {
              return null;
            }
          }
        },

        async set(key, value) {
          if (firebaseInitialized) {
            try {
              const data =
                typeof value === "string" ? JSON.parse(value) : value;
              await database.ref(key).set(data);
              return { key, value: JSON.stringify(data) };
            } catch (error) {
              console.error("Error Firebase set:", error);
              return null;
            }
          } else {
            try {
              localStorage.setItem(key, value);
              return { key, value };
            } catch (error) {
              return null;
            }
          }
        },

        async delete(key) {
          if (firebaseInitialized) {
            try {
              await database.ref(key).remove();
              return { key, deleted: true };
            } catch (error) {
              console.error("Error Firebase delete:", error);
              return null;
            }
          } else {
            try {
              localStorage.removeItem(key);
              return { key, deleted: true };
            } catch (error) {
              return null;
            }
          }
        },

        onValue(key, callback) {
          if (firebaseInitialized) {
            return database.ref(key).on("value", (snapshot) => {
              callback(snapshot.val());
            });
          }
          return null;
        },

        off(key) {
          if (firebaseInitialized) {
            database.ref(key).off();
          }
        },
      };

      async function sendEmail(to, subject, message) {

const handleImportModelos = (e) => {

    try {

      const jsonData = XLSX.utils.sheet_to_json(firstSheet);

      const modelosImportados = new Set();
      let errores = 0;

      jsonData.forEach((row) => {
        const modelo = row.Modelo || row.MODELO || row.modelo || row.Model || row.MODEL;
        
        if (modelo && String(modelo).trim()) {
          modelosImportados.add(String(modelo).trim().toUpperCase());

          errores++;

      const catalogoActualizado = [
        ...new Set([...modelosCatalogo, ...Array.from(modelosImportados)])

          errores > 0 ? `✗ ${errores} filas sin modelo válido` : ""
        }\n\nTotal en catálogo: ${catalogoActualizado.length}`

    } catch (error) {
      console.error("Error:", error);
      alert("❌ Error al importar el archivo. Verifica que tenga una columna 'Modelo'.");

       // Filtrado y ordenamiento avanzado del inventario
const getFilteredAndSortedInventory = () => {
  // Primero aplicar búsqueda general
  let filtered = inventory.filter(
    (item) =>
      item.modelo.toLowerCase().includes(searchTerm.toLowerCase()) ||
      item.ubicacion.toLowerCase().includes(searchTerm.toLowerCase()) ||
      (item.equipo &&
        item.equipo.toLowerCase().includes(searchTerm.toLowerCase())),
  );

  // Aplicar filtros específicos CON COINCIDENCIA EXACTA O PRECISA
  if (inventoryFilterModelo) {
    const searchLower = inventoryFilterModelo.toLowerCase().trim();
    filtered = filtered.filter((item) => {
      const itemLower = item.modelo.toLowerCase().trim();
      
      // Coincidencia exacta tiene prioridad
      if (itemLower === searchLower) return true;
      
      // Si busca solo números/letras al inicio, verificar que coincida al inicio
      if (/^\d+$/.test(inventoryFilterModelo)) {
        // Si busca solo números (ej: "1"), que coincida solo con "1", no con "10"
        const parts = itemLower.split(/[\s-_]/); // Dividir por espacios, guiones, underscores
        return parts.some(part => part === searchLower);
      }
      
      // Para texto, que contenga la palabra completa
      return itemLower.includes(searchLower);
    });
  }

  if (inventoryFilterUbicacion) {
    const searchLower = inventoryFilterUbicacion.toLowerCase().trim();
    filtered = filtered.filter((item) => {
      const itemLower = item.ubicacion.toLowerCase().trim();
      
      // Coincidencia exacta
      if (itemLower === searchLower) return true;
      
      // Si busca "fila 1", que NO coincida con "fila 10"
      if (/^fila\s*\d+$/i.test(inventoryFilterUbicacion)) {
        const searchNum = inventoryFilterUbicacion.match(/\d+/)[0];
        const itemMatch = itemLower.match(/fila\s*(\d+)/);
        return itemMatch && itemMatch[1] === searchNum;
      }
      
      // Para otros casos, coincidencia de palabra completa
      const regex = new RegExp(`\\b${searchLower}\\b`, 'i');
      return regex.test(itemLower);
    });
  }

  if (inventoryFilterOperacion) {
    const searchLower = inventoryFilterOperacion.toLowerCase().trim();
    filtered = filtered.filter((item) => {
      if (!item.operacionActual) return false;
      const itemLower = item.operacionActual.toLowerCase().trim();
      
      // Coincidencia exacta o palabra completa
      if (itemLower === searchLower) return true;
      const regex = new RegExp(`\\b${searchLower}\\b`, 'i');
      return regex.test(itemLower);
    });
  }

  if (inventoryFilterEquipo) {
    const searchLower = inventoryFilterEquipo.toLowerCase().trim();
    filtered = filtered.filter((item) => {
      if (!item.equipo) return false;
      const itemLower = item.equipo.toLowerCase().trim();
      
      // Coincidencia exacta o palabra completa
      if (itemLower === searchLower) return true;
      const regex = new RegExp(`\\b${searchLower}\\b`, 'i');
      return regex.test(itemLower);
    });
  }

          // Agrupar por modelo para aplicar filtro de estado
          const modelGroups = {};
          filtered.forEach((item) => {
            if (!modelGroups[item.modelo]) {
              modelGroups[item.modelo] = {
                items: [],
                total: 0,
                stockMinimo:
                  modelStockConfig[item.modelo]?.stockMinimo ||
                  parseInt(item.stockMinimo) ||
                  10,
                stockMaximo:
                  modelStockConfig[item.modelo]?.stockMaximo ||
                  parseInt(item.stockMaximo) ||
                  100,
              };
            }
            modelGroups[item.modelo].items.push(item);
            modelGroups[item.modelo].total += parseInt(item.cantidad) || 0;
          });

          // Filtrar por estado de stock
          if (inventoryFilterEstado && inventoryFilterEstado !== "todos") {
            const modelosPermitidos = new Set();

            Object.entries(modelGroups).forEach(([modelo, data]) => {
              const isCritical = data.total <= data.stockMinimo * 0.5;
              const isLow = data.total <= data.stockMinimo && !isCritical;
              const isHigh = data.total >= data.stockMaximo;
              const isOk = !isCritical && !isLow && !isHigh;

              if (
                (inventoryFilterEstado === "critico" && isCritical) ||
                (inventoryFilterEstado === "bajo" && isLow) ||
                (inventoryFilterEstado === "alto" && isHigh) ||
                (inventoryFilterEstado === "ok" && isOk)
              ) {
                modelosPermitidos.add(modelo);
              }
            });

            filtered = filtered.filter((item) =>
              modelosPermitidos.has(item.modelo),
            );
          }

          // Ordenar según criterio seleccionado
          const sortedGroups = Object.entries(modelGroups).sort(
            ([modeloA, dataA], [modeloB, dataB]) => {
              let comparison = 0;

              switch (inventorySortBy) {
                case "cantidad":
                  comparison = dataA.total - dataB.total;
                  break;
                case "ubicaciones":
                  comparison = dataA.items.length - dataB.items.length;
                  break;
                case "estado":
                  // Ordenar por criticidad: crítico > bajo > alto > ok
                  const getEstadoPrioridad = (data) => {
                    const isCritical = data.total <= data.stockMinimo * 0.5;
                    const isLow = data.total <= data.stockMinimo && !isCritical;
                    const isHigh = data.total >= data.stockMaximo;
                    if (isCritical) return 4;
                    if (isLow) return 3;
                    if (isHigh) return 2;
                    return 1;
                  };
                  comparison =
                    getEstadoPrioridad(dataA) - getEstadoPrioridad(dataB);
                  break;
                case "modelo":
                default:
                  comparison = modeloA.localeCompare(modeloB);
                  break;
              }

              return inventorySortOrder === "asc" ? comparison : -comparison;
            },
          );

          // Reconstruir array filtrado en el orden correcto
          const orderedFiltered = [];
          sortedGroups.forEach(([modelo]) => {
            const itemsDelModelo = filtered.filter(
              (item) => item.modelo === modelo,
            );
            orderedFiltered.push(...itemsDelModelo);
          });

          return orderedFiltered;
        };

        const filteredInventory = getFilteredAndSortedInventory();

        const getLowStockItems = () => {
          return inventory.filter(
            (item) =>
              parseInt(item.cantidad) <= (parseInt(item.stockMinimo) || 10),
          );
        };

        const getCriticalStockItems = () => {
          return inventory.filter(
            (item) =>
              parseInt(item.cantidad) <=
              (parseInt(item.stockMinimo) || 10) * 0.5,
          );
        };

        const getStats = () => {
          const totalRecords = inventory.length;
          const totalQuantity = inventory.reduce(
            (sum, item) => sum + parseInt(item.cantidad),
            0,
          );
          const lowStock = getLowStockItems().length;
          const critical = getCriticalStockItems().length;
          const locations = [...new Set(inventory.map((i) => i.ubicacion))]
            .length;
          const uniqueModels = [...new Set(inventory.map((i) => i.modelo))]
            .length;

          return {
            totalRecords,
            totalQuantity,
            uniqueModels,
            lowStock,
            critical,
            locations,
          };
        };

        // ==================== FUNCIONES DE ANÁLISIS AVANZADO ====================

        // Obtener número de semana del año
        const getWeekNumber = (date) => {
          const d = new Date(
            Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()),
          );
          const dayNum = d.getUTCDay() || 7;
          d.setUTCDate(d.getUTCDate() + 4 - dayNum);
          const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
          return Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
        };

        // Obtener semana actual
        const getCurrentWeek = () => {
          const now = new Date();
          return {
            week: getWeekNumber(now),
            year: now.getFullYear(),
            display: `Semana ${getWeekNumber(now)} - ${now.getFullYear()}`,
          };
        };

        // Obtener todas las semanas con datos
        const getAllWeeks = () => {
          const weeksMap = {};

          changeHistory.forEach((entry) => {
            if (entry.date) {
              const date = new Date(entry.date);
              const week = getWeekNumber(date);
              const year = date.getFullYear();
              const key = `${year}-W${week}`;

              if (!weeksMap[key]) {
                weeksMap[key] = {
                  week,
                  year,
                  key,
                  display: `Semana ${week} - ${year}`,
                  entries: [],
                  stats: {
                    total: 0,
                    byOperation: {},
                    byUser: {},
                    entriesCount: 0,
                    exitsCount: 0,
                    editsCount: 0,
                    quantitiesAdded: 0,
                    quantitiesRemoved: 0,
                    quantitiesEdited: 0,
                  },
                };
              }

              weeksMap[key].entries.push(entry);
              weeksMap[key].stats.total++;

              // Extraer cantidad del details
              const quantityMatch = entry.details.match(/(\d+)\s*unidades?/i);
              const quantity = quantityMatch ? parseInt(quantityMatch[1]) : 0;

              // Contar por tipo y acumular cantidades
              if (
                entry.action.includes("agregó") ||
                entry.action.includes("Aprobación") ||
                entry.action.includes("Importación")
              ) {
                weeksMap[key].stats.entriesCount++;
                weeksMap[key].stats.quantitiesAdded += quantity;
              } else if (entry.action.includes("eliminó")) {
                weeksMap[key].stats.exitsCount++;
                weeksMap[key].stats.quantitiesRemoved += quantity;
              } else if (
                entry.action.includes("editó") ||
                entry.action.includes("ajustó")
              ) {
                weeksMap[key].stats.editsCount++;
                weeksMap[key].stats.quantitiesEdited += quantity;
              }

              // Contar por usuario
              const userKey = entry.userEmail || entry.user;
              weeksMap[key].stats.byUser[userKey] =
                (weeksMap[key].stats.byUser[userKey] || 0) + 1;

              // Contar por operación
              const operation = entry.action;
              weeksMap[key].stats.byOperation[operation] =
                (weeksMap[key].stats.byOperation[operation] || 0) + 1;
            }
          });

          // Ordenar por semana más reciente
          return Object.values(weeksMap).sort((a, b) => {
            if (a.year !== b.year) return b.year - a.year;
            return b.week - a.week;
          });
        };

        // Filtrar entradas de semanas
        const filterWeekEntries = (entries) => {
          return entries.filter((entry) => {
            const details = entry.details.toLowerCase();

            const matchModelo =
              !weekFilterModelo ||
              details.includes(weekFilterModelo.toLowerCase());

            const matchUbicacion =
              !weekFilterUbicacion ||
              details.includes(weekFilterUbicacion.toLowerCase());

            const matchOperacion =
              !weekFilterOperacion ||
              details.includes(weekFilterOperacion.toLowerCase());

            const matchEquipo =
              !weekFilterEquipo ||
              details.includes(weekFilterEquipo.toLowerCase());

            return (
              matchModelo && matchUbicacion && matchOperacion && matchEquipo
            );
          });
        };

        // Obtener cantidades de modelos por período dinámico
        const getModelQuantitiesByPeriod = () => {
          const periodsMap = {};

          inventory.forEach((item) => {
            // Determinar qué fecha usar
            let dateToUse;

            if (dateFieldType === "etiqueta" && item.fechaEtiqueta) {
              dateToUse = new Date(item.fechaEtiqueta);
            } else if (dateFieldType === "registro" && item.fechaRegistro) {
              dateToUse = new Date(item.fechaRegistro);
            } else {
              // Fallback: buscar en historial
              const addEntry = changeHistory.find(
                (entry) =>
                  entry.action.includes("agregó") &&
                  entry.details
                    .toLowerCase()
                    .includes(item.modelo.toLowerCase()) &&
                  entry.details
                    .toLowerCase()
                    .includes(item.ubicacion.toLowerCase()),
              );
              dateToUse =
                addEntry && addEntry.date
                  ? new Date(addEntry.date)
                  : new Date();
            }

            // Filtro de rango personalizado
            if (customStartDate && dateToUse < new Date(customStartDate))
              return;
            if (
              customEndDate &&
              dateToUse > new Date(customEndDate + "T23:59:59")
            )
              return;

            // Generar clave según el tipo de período
            let key, display;

            switch (dateRangeType) {
              case "day":
                key = dateToUse.toISOString().split("T")[0];
                display = new Date(key).toLocaleDateString("es-MX", {
                  day: "2-digit",
                  month: "short",
                  year: "numeric",
                });
                break;
              case "week":
                const week = getWeekNumber(dateToUse);
                const year = dateToUse.getFullYear();
                key = `${year}-W${week}`;
                display = `Semana ${week} - ${year}`;
                break;
              case "month":
                key = `${dateToUse.getFullYear()}-${String(
                  dateToUse.getMonth() + 1,
                ).padStart(2, "0")}`;
                display = dateToUse.toLocaleDateString("es-MX", {
                  month: "long",
                  year: "numeric",
                });
                break;
              case "year":
                key = String(dateToUse.getFullYear());
                display = `Año ${key}`;
                break;
              default:
                key = dateToUse.toISOString().split("T")[0];
                display = key;
            }

            if (!periodsMap[key]) {
              periodsMap[key] = {
                key,
                display,
                date: dateToUse,
                models: {},
                byOperation: {},
                byLocation: {},
                byEquipo: {},
                totalQuantity: 0,
                itemCount: 0,
              };
            }

            // Acumular por modelo
            if (!periodsMap[key].models[item.modelo]) {
              periodsMap[key].models[item.modelo] = 0;
            }
            periodsMap[key].models[item.modelo] += parseInt(item.cantidad) || 0;

            // Acumular por operación
            if (item.operacionActual) {
              if (!periodsMap[key].byOperation[item.operacionActual]) {
                periodsMap[key].byOperation[item.operacionActual] = 0;
              }
              periodsMap[key].byOperation[item.operacionActual] +=
                parseInt(item.cantidad) || 0;
            }

            // Acumular por ubicación
            if (!periodsMap[key].byLocation[item.ubicacion]) {
              periodsMap[key].byLocation[item.ubicacion] = 0;
            }
            periodsMap[key].byLocation[item.ubicacion] +=
              parseInt(item.cantidad) || 0;

            // Acumular por equipo
            if (item.equipo) {
              if (!periodsMap[key].byEquipo[item.equipo]) {
                periodsMap[key].byEquipo[item.equipo] = 0;
              }
              periodsMap[key].byEquipo[item.equipo] +=
                parseInt(item.cantidad) || 0;
            }

            periodsMap[key].totalQuantity += parseInt(item.cantidad) || 0;
            periodsMap[key].itemCount++;
          });

          // Ordenar por fecha más reciente
          return Object.values(periodsMap).sort((a, b) => b.date - a.date);
        };

        const filterChartData = (periods) => {
          if (
            !chartFilterModelo &&
            !chartFilterOperacion &&
            !chartFilterUbicacion
          ) {
            return periods;
          }

          return periods.map((period) => {
            let filteredTotalQuantity = 0;
            const filteredModels = {};
            const filteredByOperation = {};
            const filteredByLocation = {};

            // Filtrar inventario de este período
            inventory.forEach((item) => {
              // Determinar fecha a usar
              let dateToUse;
              if (dateFieldType === "etiqueta" && item.fechaEtiqueta) {
                dateToUse = new Date(item.fechaEtiqueta);
              } else if (dateFieldType === "registro" && item.fechaRegistro) {
                dateToUse = new Date(item.fechaRegistro);
              } else {
                const addEntry = changeHistory.find(
                  (entry) =>
                    entry.action.includes("agregó") &&
                    entry.details
                      .toLowerCase()
                      .includes(item.modelo.toLowerCase()) &&
                    entry.details
                      .toLowerCase()
                      .includes(item.ubicacion.toLowerCase()),
                );
                dateToUse =
                  addEntry && addEntry.date
                    ? new Date(addEntry.date)
                    : new Date();
              }

              // Verificar si pertenece a este período
              let belongsToPeriod = false;
              switch (dateRangeType) {
                case "day":
                  belongsToPeriod =
                    dateToUse.toISOString().split("T")[0] === period.key;
                  break;
                case "week":
                  const week = getWeekNumber(dateToUse);
                  const year = dateToUse.getFullYear();
                  belongsToPeriod = `${year}-W${week}` === period.key;
                  break;
                case "month":
                  belongsToPeriod =
                    `${dateToUse.getFullYear()}-${String(
                      dateToUse.getMonth() + 1,
                    ).padStart(2, "0")}` === period.key;
                  break;
                case "year":
                  belongsToPeriod =
                    String(dateToUse.getFullYear()) === period.key;
                  break;
              }

              if (belongsToPeriod) {
                const matchModelo =
                  !chartFilterModelo ||
                  item.modelo
                    .toLowerCase()
                    .includes(chartFilterModelo.toLowerCase());

                const matchOperacion =
                  !chartFilterOperacion ||
                  (item.operacionActual &&
                    item.operacionActual
                      .toLowerCase()
                      .includes(chartFilterOperacion.toLowerCase()));

                const matchUbicacion =
                  !chartFilterUbicacion ||
                  item.ubicacion
                    .toLowerCase()
                    .includes(chartFilterUbicacion.toLowerCase());

                if (matchModelo && matchOperacion && matchUbicacion) {
                  const qty = parseInt(item.cantidad) || 0;

                  if (!filteredModels[item.modelo]) {
                    filteredModels[item.modelo] = 0;
                  }
                  filteredModels[item.modelo] += qty;

                  if (item.operacionActual) {
                    if (!filteredByOperation[item.operacionActual]) {
                      filteredByOperation[item.operacionActual] = 0;
                    }
                    filteredByOperation[item.operacionActual] += qty;
                  }

                  if (!filteredByLocation[item.ubicacion]) {
                    filteredByLocation[item.ubicacion] = 0;
                  }
                  filteredByLocation[item.ubicacion] += qty;

                  filteredTotalQuantity += qty;
                }
              }
            });

            return {
              ...period,
              models: filteredModels,
              byOperation: filteredByOperation,
              byLocation: filteredByLocation,
              totalQuantity: filteredTotalQuantity,
            };
          });
        };

        // Obtener estadísticas de semana específica
        const getWeekStats = (weekKey) => {
          const weeks = getAllWeeks();
          return weeks.find((w) => w.key === weekKey);
        };

        // Obtener datos para gráfica acumulativa
        const getWeeklyCumulativeData = () => {
          const weeks = getAllWeeks().reverse(); // Más antigua a más reciente
          let cumulative = 0;

          return weeks.map((week) => {
            cumulative += week.stats.total;
            return {
              ...week,
              cumulative,
              weekLabel: `S${week.week}`,
            };
          });
        };

        // Comparar semanas
        const compareWeeks = (week1Key, week2Key) => {
          const week1 = getWeekStats(week1Key);
          const week2 = getWeekStats(week2Key);

          if (!week1 || !week2) return null;

          return {
            week1: week1.display,
            week2: week2.display,
            totalDiff: week1.stats.total - week2.stats.total,
            entriesDiff: week1.stats.entriesCount - week2.stats.entriesCount,
            exitsDiff: week1.stats.exitsCount - week2.stats.exitsCount,
            editsDiff: week1.stats.editsCount - week2.stats.editsCount,
            percentChange: (
              ((week1.stats.total - week2.stats.total) / week2.stats.total) *
              100
            ).toFixed(1),
          };
        };

        // Filtrar historial
        const getFilteredHistory = () => {
          return changeHistory.filter((entry) => {
            const matchUser =
              !historyFilterUser ||
              entry.userEmail
                .toLowerCase()
                .includes(historyFilterUser.toLowerCase()) ||
              entry.user
                .toLowerCase()
                .includes(historyFilterUser.toLowerCase());

            const matchDate = () => {
              if (!historyFilterStartDate && !historyFilterEndDate) return true;
              const entryDate = new Date(entry.date);
              const startDate = historyFilterStartDate
                ? new Date(historyFilterStartDate)
                : null;
              const endDate = historyFilterEndDate
                ? new Date(historyFilterEndDate + "T23:59:59")
                : null;

              if (startDate && endDate) {
                return entryDate >= startDate && entryDate <= endDate;
              } else if (startDate) {
                return entryDate >= startDate;
              } else if (endDate) {
                return entryDate <= endDate;
              }
              return true;
            };

            return matchUser && matchDate();
          });
        };

        // Obtener actividad por usuario (entradas/salidas)
        const getUserActivity = (period = "month") => {
          const now = new Date();
          const periodStart = new Date();

          if (period === "week") {
            periodStart.setDate(now.getDate() - 7);
          } else if (period === "month") {
            periodStart.setMonth(now.getMonth() - 1);
          }

          const activityMap = {};

          changeHistory.forEach((entry) => {
            const entryDate = new Date(entry.date);
            if (entryDate >= periodStart) {
              if (!activityMap[entry.userEmail]) {
                activityMap[entry.userEmail] = {
                  name: entry.user,
                  email: entry.userEmail,
                  entries: 0,
                  exits: 0,
                  edits: 0,
                  total: 0,
                };
              }

              if (
                entry.action.includes("agregado") ||
                entry.action.includes("Aprobación") ||
                entry.action.includes("Importación")
              ) {
                activityMap[entry.userEmail].entries++;
              } else if (entry.action.includes("eliminado")) {
                activityMap[entry.userEmail].exits++;
              } else if (
                entry.action.includes("editado") ||
                entry.action.includes("ajustó")
              ) {
                activityMap[entry.userEmail].edits++;
              }

              activityMap[entry.userEmail].total++;
            }
          });

          return Object.values(activityMap).sort((a, b) => b.total - a.total);
        };

        // Obtener flujo de proceso por modelo
        const getProcessFlow = (modelo) => {
          if (!modelo || !modelo.trim()) return [];

          const items = inventory.filter(
            (item) =>
              item.modelo.toLowerCase().trim() === modelo.toLowerCase().trim(),
          );

          if (items.length === 0) return [];

          const flow = [];

          items.forEach((item) => {
            // Solo agregar si tiene operación actual
            if (item.operacionActual && item.operacionActual.trim()) {
              flow.push({
                step: item.operacionActual,
                nextStep:
                  item.proximaOperacion && item.proximaOperacion.trim()
                    ? item.proximaOperacion
                    : "Finalizado",
                location: item.ubicacion,
                quantity: item.cantidad,
                equipment: item.equipo || "Sin equipo",
                modelo: item.modelo,
              });
            }
          });

          return flow;
        };

        // Material con más tiempo detenido
        const getStagnantMaterials = () => {
          // Fecha actual solo con día (sin horas)
          const now = new Date();
          const today = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
          );

          const materialsWithActivity = inventory.map((item) => {
            // Buscar última actividad de este item en el historial
            const lastActivity = changeHistory
              .filter((entry) => {
                if (!entry || !entry.details || !entry.action) return false;
                const details = String(entry.details).toLowerCase();
                const modelo = String(item.modelo).toLowerCase();
                const ubicacion = String(item.ubicacion).toLowerCase();

                return (
                  details.includes(modelo) &&
                  (details.includes(ubicacion) ||
                    entry.action.includes("ajustó") ||
                    entry.action.includes("editado") ||
                    entry.action.includes("agregó"))
                );
              })
              .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

            // Determinar fecha de última actividad
            let lastActivityDate;

            if (lastActivity && lastActivity.date) {
              // Usar fecha del historial
              const actDate = new Date(lastActivity.date);
              lastActivityDate = new Date(
                actDate.getFullYear(),
                actDate.getMonth(),
                actDate.getDate(),
              );
            } else if (item.fechaRegistro) {
              // Usar fecha de registro del item
              const regDate = new Date(item.fechaRegistro);
              lastActivityDate = new Date(
                regDate.getFullYear(),
                regDate.getMonth(),
                regDate.getDate(),
              );
            } else {
              // Si no hay fecha, usar hoy (material sin fecha)
              lastActivityDate = today;
            }

            // Calcular días transcurridos (nunca negativo)
            const millisDiff = today.getTime() - lastActivityDate.getTime();
            const daysSinceActivity = Math.max(
              0,
              Math.floor(millisDiff / (1000 * 60 * 60 * 24)),
            );

            return {
              ...item,
              lastActivity: lastActivityDate,
              daysSinceActivity,
              lastAction: lastActivity?.action || "Recién agregado",
            };
          });

          return materialsWithActivity
            .sort((a, b) => b.daysSinceActivity - a.daysSinceActivity)
            .slice(0, 10);
        };

        const ConnectionIndicator = () => (
          <div
            className={`flex items-center gap-2 px-3 py-1 rounded-full text-xs ${
              connectionStatus === "connected"
                ? "bg-green-900/30 text-green-400 border border-green-500"
                : connectionStatus === "local"
                  ? "bg-yellow-900/30 text-yellow-400 border border-yellow-500"
                  : "bg-red-900/30 text-red-400 border border-red-500"
            }`}
          >
            {connectionStatus === "connected" ? <Cloud /> : <CloudOff />}
            {connectionStatus === "connected"
              ? "Sincronizado"
              : connectionStatus === "local"
                ? "Modo Local"
                : "Sin conexión"}
          </div>
        );

        // ==================== VISTAS ====================
        if (view === "login") {
          return (
            <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex items-center justify-center p-4">
              <div className="bg-slate-800/50 backdrop-blur-xl rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-700">
                <div className="flex flex-col items-center mb-8">
                  <div className="bg-blue-600 p-4 rounded-full mb-4">
                    <Package className="w-10 h-10" />
                  </div>
                  <h1 className="text-3xl font-bold text-white mb-2">
                    Sistema de Inventario
                  </h1>
                  <p className="text-slate-400">Inicia sesión para continuar</p>
                </div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">
                      Email
                    </label>
                    <input
                      type="email"
                      name="email"
                      required
                      className="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
                      placeholder="tu@email.com"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-300 mb-2">
                      Contraseña
                    </label>
                    <input
                      type="password"

                      inventorySortBy === "ubicaciones"
                        ? "bg-blue-600 text-white"
                        : "bg-slate-700 text-slate-300 hover:bg-slate-600"
                    }`}
                  >
                    📍 Nº Ubicaciones
                  </button>

                  <button
                    onClick={() => setInventorySortBy("estado")}
                    className={`px-3 py-1 rounded text-xs font-semibold transition-colors ${
                      inventorySortBy === "estado"
                        ? "bg-blue-600 text-white"
                        : "bg-slate-700 text-slate-300 hover:bg-slate-600"
                    }`}
                  >
                    ⚠️ Estado Stock
                  </button>

                  <div className="ml-auto flex items-center gap-2">
                    <span className="text-xs text-slate-400">Orden:</span>
                    <button
                      onClick={() =>
                        setInventorySortOrder(
                          inventorySortOrder === "asc" ? "desc" : "asc",
                        )
                      }
                      className="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white rounded text-xs font-semibold flex items-center gap-1"
                    >
                      {inventorySortOrder === "asc"
                        ? "↑ Ascendente"
                        : "↓ Descendente"}
                    </button>
                  </div>
                </div>

                {/* Contador de resultados */}
                <div className="mt-3 pt-3 border-t border-slate-700">
                  <p className="text-xs text-slate-400">
                    Mostrando{" "}
                    <span className="text-blue-400 font-bold">
                      {filteredInventory.length}
                    </span>{" "}
                    items de{" "}
                    <span className="text-white font-bold">
                      {inventory.length}
                    </span>{" "}
                    totales
                    {(inventoryFilterModelo ||
                      inventoryFilterUbicacion ||
                      inventoryFilterOperacion ||
                      inventoryFilterEquipo ||
                      inventoryFilterEstado) && (
                      <span className="text-yellow-400 ml-2">
                        (filtrado activo)
                      </span>
                    )}
                  </p>
                </div>
              </div>

              {/* BARRA DE ACCIONES MASIVAS */}
              {selectionMode && selectedItems.length > 0 && (
                <div className="mb-4 p-4 bg-blue-600/20 border border-blue-500 rounded-lg flex items-center justify-between animate-fade-in">
                  <span className="text-white font-medium">
                    {selectedItems.length} items seleccionados
                  </span>
                  <div className="flex gap-2">
                    <button
                      onClick={selectAllVisible}
                      className="px-3 py-1 bg-blue-500 hover:bg-blue-400 text-white rounded text-sm"
                    >
                      Seleccionar Todo
                    </button>
                    <button
                      onClick={deleteSelectedItems}
                      className="px-3 py-1 bg-red-600 hover:bg-red-500 text-white rounded text-sm flex items-center gap-1"
                    >
                      <Trash2 /> Eliminar Seleccionados
                    </button>
                  </div>
                </div>
              )}

              {filteredInventory.length === 0 ? (
                <div className="text-center py-12">
                  <Package className="w-16 h-16 text-slate-600 mx-auto" />
                  <p className="text-slate-400 mt-4">No hay items</p>
                </div>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr
                        className={`border-b ${
                          darkMode ? "border-slate-700" : "border-slate-700"
                        }`}
                      >
                        <th className="py-3 px-3"></th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Modelo
                        </th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Total
                        </th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Ubicaciones
                        </th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Stock Mín/Máx
                        </th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Estado
                        </th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Fecha Etiqueta
                        </th>
                        <th className="text-left py-3 px-3 text-slate-300 font-semibold">
                          Acciones
                        </th>
                      </tr>
                    </thead>
                    <tbody>
                      {(() => {
                        const modelGroups = {};
                        filteredInventory.forEach((item) => {
                          if (!modelGroups[item.modelo]) {
                            modelGroups[item.modelo] = {
                              items: [],
                              total: 0,
                              stockMinimo:
                                modelStockConfig[item.modelo]?.stockMinimo ||
                                parseInt(item.stockMinimo) ||
                                10,
                              stockMaximo:
                                modelStockConfig[item.modelo]?.stockMaximo ||
                                parseInt(item.stockMaximo) ||
                                100,
                            };
                          }
                          modelGroups[item.modelo].items.push(item);
                          modelGroups[item.modelo].total +=
                            parseInt(item.cantidad) || 0;
                        });

                        return Object.entries(modelGroups).map(
                          ([modelo, data]) => {
                            const isLow = data.total <= data.stockMinimo;
                            const isCritical =
                              data.total <= data.stockMinimo * 0.5;
                            const isHigh = data.total >= data.stockMaximo;
                            const isExpanded = expandedModels[modelo];

                            return (
                              <React.Fragment key={modelo}>
                                <tr
                                  className={`border-b ${
                                    darkMode
                                      ? "border-slate-700"
                                      : "border-slate-200"
                                  } hover:bg-slate-800/20`}
                                >
                                  <td className="py-4 px-2 text-center">
                                    <button
                                      onClick={() =>
                                        setExpandedModels({
                                          ...expandedModels,
                                          [modelo]: !isExpanded,
                                        })
                                      }
                                      className="text-blue-400"
                                    >
                                      {isExpanded ? "▼" : "▶"}
                                    </button>
                                  </td>
                                  <td className="py-4 px-3">
                                    <span className="text-white font-bold text-lg">
                                      {modelo}
                                    </span>
                                  </td>
                                  <td className="py-4 px-3 text-2xl font-bold text-white">
                                    {data.total}
                                  </td>
                                  <td className="py-4 px-3 text-slate-300">
                                    {data.items.length} sitios
                                  </td>
                                  <td className="py-4 px-3 text-slate-400">
                                    {data.stockMinimo} / {data.stockMaximo}
                                  </td>
                                  <td className="py-4 px-3">
                                    <span
                                      className={`px-2 py-1 rounded text-xs font-bold ${
                                        isCritical
                                          ? "bg-red-600 text-white"
                                          : isLow
                                            ? "bg-yellow-600 text-white"
                                            : isHigh
                                              ? "bg-blue-600 text-white"
                                              : "bg-green-600 text-white"
                                      }`}
                                    >
                                      {isCritical
                                        ? "CRÍTICO"
                                        : isLow
                                          ? "BAJO"
                                          : isHigh
                                            ? "ALTO"
                                            : "OK"}
                                    </span>
                                  </td>
                                  <td className="py-4 px-3">
                                    {currentUser?.role === "admin" && (
                                      <button
                                        onClick={() =>
                                          handleEdit(data.items[0])
                                        }
                                        className="text-blue-400 hover:underline"
                                      >
                                        Configurar
                                      </button>
                                    )}
                                  </td>
                                </tr>

                                {/* FILAS DE UBICACIONES HIJAS */}
                                {isExpanded &&
                                  data.items.map((item) => (
                                    <tr
                                      key={item.id}
                                      className={`${
                                        darkMode
                                          ? "bg-slate-900/40"
                                          : "bg-slate-100/50"
                                      } border-b border-slate-700/30 transition-all`}
                                    >
                                      <td className="py-3 px-2 text-center">
                                        {selectionMode && (
                                          <input
                                            type="checkbox"
                                            className="w-4 h-4 rounded border-slate-600 text-blue-600 focus:ring-blue-500"
                                            checked={selectedItems.includes(
                                              item.id,
                                            )}
                                            onChange={() =>
                                              toggleSelectItem(item.id)
                                            }
                                          />
                                        )}
                                      </td>
                                      <td className="py-3 px-3 pl-8 text-slate-300">
                                        📍 {item.ubicacion}
                                      </td>
                                      <td className="py-3 px-3">
                                        <div className="flex items-center gap-2">
                                          <button
                                            onClick={() =>
                                              handleAdjustQuantity(item.id, -1)
                                            }
                                            className="w-6 h-6 bg-red-900/50 text-red-400 rounded"
                                          >
                                            -
                                          </button>
                                          <span className="font-bold text-white w-8 text-center">
                                            {item.cantidad}
                                          </span>
                                          <button
                                            onClick={() =>
                                              handleAdjustQuantity(item.id, 1)
                                            }
                                            className="w-6 h-6 bg-green-900/50 text-green-400 rounded"
                                          >
                                            +
                                          </button>
                                        </div>
                                      </td>
                                      <td className="py-3 px-3 text-slate-400 text-xs italic">
                                        {item.equipo || "Sin equipo"}
                                      </td>
                                      <td className="py-3 px-3 text-slate-400 text-xs">
                                        {item.operacionActual || "N/A"}{" "}
                                        {item.proximaOperacion
                                          ? `➡ ${item.proximaOperacion}`
                                          : ""}
                                      </td>
                                      <td className="py-3 px-3 text-blue-300 text-xs font-mono">
                                        {item.fechaEtiqueta || "Sin fecha"}
                                      </td>
                                      <td className="py-3 px-3">
                                        <div className="flex gap-2">
                                          <button
                                            onClick={() => handleEdit(item)}
                                            className="p-1.5 bg-blue-600/20 text-blue-400 rounded hover:bg-blue-600/40"
                                          >
                                            <Edit2 />
                                          </button>
                                          <button
                                            onClick={() =>
                                              handleDelete(item.id)
                                            }
                                            className="p-1.5 bg-red-600/20 text-red-400 rounded hover:bg-red-600/40"
                                          >
                                            <Trash2 />
                                          </button>
                                        </div>
                                      </td>
                                    </tr>
                                  ))}
                              </React.Fragment>
                            );
                          },
                        );
                      })()}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            <div className="mt-4 p-4 bg-blue-900/20 border border-blue-700 rounded-lg">
              <p className="text-blue-300 text-sm flex items-center gap-2">
                <span className="text-lg">💡</span>
                <strong>Tip:</strong> Haz clic en ▶ para expandir y ver todas
                las ubicaciones del modelo. El stock se calcula sumando todas
                las ubicaciones.
              </p>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<InventoryApp />);
    </script>
  </body>
</html>
